[project]
name = "research-replication-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "ale-py>=0.12.1",
    "anthropic>=1.0",
    "datasets>=5.0.1",
    "gymnasium>=1.3.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandas-datareader>=0.11.1",
    "pandera>=0.33.1",
    "peft>=0.21.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.18.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sacrebleu>=2.6.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "typer>=0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
replicate = "replicator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replicator", "evals"]
