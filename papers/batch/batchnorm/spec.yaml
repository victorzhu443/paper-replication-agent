  source: paper_text
  reason: 'Sec 3.2 (p.5): the bias is redundant because of the subsequent mean subtraction;
    its role is subsumed by beta, so z=g(Wu+b) is replaced by z=g(BN(Wu)). The non-BN
    baseline keeps its bias b.'
  sensitivity: low
