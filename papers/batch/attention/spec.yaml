data:
  sources:
  - canonical: wmt14_en_de
    description: 'Standard WMT 2014 English-German training corpus, ~4.5M sentence
      pairs, shared source-target byte-pair-encoding vocabulary of ~37000 tokens (Section
      5.1, p7). Dev: newstest2013 (Table 3); test: newstest2014 (Table 2).'
    substitute: hf_datasets:wmt/wmt14
  - canonical: wmt14_en_fr
    description: 'WMT 2014 English-French training corpus, 36M sentences, 32000 word-piece
      vocabulary (Section 5.1, p7; paper does not state whether this vocabulary is
      shared source-target). Test: newstest2014.'
    substitute: hf_datasets:wmt/wmt14
  - canonical: penn_treebank_wsj
    description: 'WSJ portion of the Penn Treebank for English constituency parsing,
      ~40K training sentences, 16K token vocabulary; semi-supervised setting adds
      high-confidence and BerkeleyParser corpora (~17M sentences), 32K vocabulary
      (Section 6.3, p9). Dev: Section 22; test: Section 23.'
    substitute: hf_datasets:ptb-text-only/ptb_text_only
  universe:
    task_paper_primary: sequence-to-sequence machine translation (EN-DE, EN-FR)
    task_paper_secondary: English constituency parsing (WSJ)
    task_reduced_scale: 'synthetic sequence transduction: copy and/or reverse of random
      token sequences'
    reduced_vocab_size: 32 symbols (+ pad/bos/eos) for synthetic task
    reduced_seq_len: <= 20 tokens per source sequence
    reduced_train_examples: ~20000 generated pairs (or <=20k IWSLT-style pairs)
  frequency: none (single static training run per configuration; no time-series panel)
  preprocessing:
    tokenization_ende: byte-pair encoding, shared source-target vocab ~37000 tokens
      (Section 5.1, p7)
    tokenization_enfr: word-piece, 32000 vocab (Section 5.1, p7)
    batching: sentence pairs batched together by approximate sequence length; ~25000
      source tokens and ~25000 target tokens per batch (Section 5.1, p7)
    decoder_input_shift: output embeddings offset by one position (shifted right)
      with causal masking so position i sees only outputs < i (Section 3.1, p3; Figure
      1)
    reduced_tokenization: character/symbol-level integer ids for synthetic task; no
      subword model
    padding_masking: pad to max length in batch, mask pads in attention and in loss
    augmentation: none stated in paper
  splits:
    wmt_dev: newstest2013 (used for Table 3 model variations, EN-DE)
    wmt_test: newstest2014 (used for Table 2 BLEU, EN-DE and EN-FR)
    parsing_dev: WSJ Section 22 (selection of dropout, learning rates, beam size only)
    parsing_test: WSJ Section 23 (Table 4 F1)
    reduced_splits: 80/10/10 train/validation/test of generated pairs, disjoint sequences;
      report on test
method:
  signal: Encoder-decoder Transformer built entirely from multi-head scaled dot-product
    attention plus position-wise feed-forward layers, residual connections, layer
    normalization, and sinusoidal positional encodings; no recurrence, no convolution.
    Trained with teacher forcing on next-token cross-entropy with label smoothing;
    decoded with beam search.
  model:
    architecture: N=6 identical encoder layers (multi-head self-attention sub-layer
      + position-wise FFN sub-layer) and N=6 identical decoder layers (masked multi-head
      self-attention + multi-head encoder-decoder attention over encoder output +
      position-wise FFN); every sub-layer output is LayerNorm(x + Sublayer(x)), i.e.
      post-norm (Section 3.1, p3)
    d_model: 512 (base), 1024 (big)
    d_ff: 2048 (base), 4096 (big)
    heads_h: 8 (base), 16 (big)
    d_k_d_v: 64 each (base) = d_model/h; Table 3 leaves d_k/d_v unlisted for the big
      row, i.e. identical to base (64 = 1024/16)
    attention: Attention(Q,K,V) = softmax(QK^T / sqrt(d_k)) V; MultiHead = Concat(head_1..head_h)
      W^O with per-head projections W^Q, W^K in R^{d_model x d_k} and W^V in R^{d_model
      x d_v}; decoder self-attention masks illegal (future) connections by setting
      softmax inputs to -inf
    ffn: FFN(x) = max(0, xW1+b1)W2+b2 (ReLU), applied position-wise, separate parameters
      per layer
    positional_encoding: 'fixed sinusoidal: PE(pos,2i)=sin(pos/10000^{2i/d_model}),
      PE(pos,2i+1)=cos(pos/10000^{2i/d_model}); wavelengths geometric from 2*pi to
      10000*2*pi; added to input embeddings at the bottom of both stacks (Section
      3.5, p6)'
    embedding_sharing: input embedding, output embedding and pre-softmax linear share
      one weight matrix; embedding weights multiplied by sqrt(d_model) (Section 3.4,
      p5)
    dropout: Residual dropout applied to each sub-layer output before the residual
      add and normalization, and to the sums of embeddings and positional encodings
      in both stacks; P_drop=0.1 for base, 0.3 for big EN-DE (Table 3 big row), 0.1
      for big EN-FR (Section 6.1, p8). Paper claims 'three types of regularization'
      but explicitly describes only residual dropout and label smoothing; attention
      dropout rate is never stated.
    label_smoothing: eps_ls = 0.1 (Section 5.4, p8); also listed in the Table 3 base
      row
    loss: token-level cross-entropy over the shared vocabulary with label smoothing
      0.1 (paper does not state whether reported dev perplexity uses the smoothed
      or unsmoothed objective)
    optimizer: Adam, beta1=0.9, beta2=0.98, eps=1e-9 (Section 5.3, p7)
    lr_schedule: lrate = d_model^-0.5 * min(step_num^-0.5, step_num * warmup_steps^-1.5),
      warmup_steps=4000 (Eq. 3, p7)
    train_steps: 100,000 steps (base; ~0.4 s/step, ~12 h on 8 P100 GPUs) / 300,000
      steps (big; ~1.0 s/step, 3.5 days) (Section 5.2, p7)
    reduced_scale_model: 2-layer encoder / 2-layer decoder, d_model=128, d_ff=512,
      h=4, d_k=d_v=32, dropout=0.1, same sinusoidal PE and Adam+warmup schedule scaled
      to the shorter run
    reduced_scale_budget: CPU only, <= 15 minutes wall-clock per run, fixed step count
      rather than fixed epochs
    no_attention_baseline: 'same encoder-decoder skeleton with all attention sub-layers
      removed: encoder = position-wise FFN stack over embeddings with a fixed summary
      (mean-pooled) context vector fed to every decoder position; decoder = position-wise
      FFN stack with causal-safe inputs only (no cross-attention, no self-attention).
      Not a paper ablation; internal control only.'
  evaluation:
  - corpus BLEU on newstest2014 (EN-DE, EN-FR) for Table 2 (paper scale, Untested
    here)
  - per-wordpiece perplexity and BLEU on newstest2013 dev for Table 3 ablations (paper
    scale, Untested here)
  - F1 on WSJ Section 23 for Table 4 (paper scale, Untested here)
  - training cost in FLOPs estimated as training_time x n_GPUs x sustained single-precision
    capacity (2.8/3.7/6.0/9.5 TFLOPS for K80/K40/M40/P100) for Table 2 (paper scale,
    Untested here)
  - 'reduced scale: token-level cross-entropy loss on held-out test split'
  - 'reduced scale: token accuracy (exact-match per target token, pads excluded) on
    held-out test split'
  - 'reduced scale: corpus BLEU on greedy/beam decodes of held-out test split'
  - 'reduced scale: same three metrics for the no-attention baseline'
  eval_protocol:
    decoding_paper: beam search, beam size 4, length penalty alpha=0.6 following [38];
      max output length = input length + 50, terminate early when possible (Section
      6.1, p8); hyperparameters chosen on the development set
    checkpoint_averaging_paper: 'Table 2: single model from averaging the last 5 checkpoints
      (base), written at 10-minute intervals, and the last 20 checkpoints (big); paper
      does not state the checkpoint interval for the big models. Table 3: explicitly
      no checkpoint averaging (p9).'
    decoding_parsing: beam size 21, alpha=0.3 for both WSJ-only and semi-supervised;
      max output length = input length + 300 (Section 6.3, p10)
    decoding_reduced: greedy decoding primary; beam=4 alpha=0.6 as secondary check
    reduced_seeds: 3 random seeds; report mean and std of loss, token accuracy, BLEU
    bleu_tool: paper does not name a BLEU implementation; reduced task uses a single
      consistent implementation across variants (sacrebleu corpus_bleu on detokenized
      output)
    report_split: held-out test split for the reduced task; paper Table 2/Table 4
      are test (newstest2014 / WSJ 23), Table 3 is dev (newstest2013)
    paper_scale_status: 'Untested: WMT14/PTB-scale claims cannot be run at compute
      tier 2'
  variants:
    base_ende:
      config: 'base: N=6, d_model=512, d_ff=2048, h=8, d_k=d_v=64, P_drop=0.1, eps_ls=0.1,
        100K steps'
      data: WMT14 EN-DE (BPE, shared ~37K vocab), newstest2014 test
      inference: average last 5 checkpoints (10-min intervals), beam 4, alpha 0.6,
        max len = src + 50
    base_enfr:
      config: base hyperparameters, 100K steps (paper does not separately report the
        base EN-FR configuration; 'base models' are stated to use the hyperparameters
        described throughout the paper)
      data: WMT14 EN-FR (32K word-piece), newstest2014 test
      inference: average last 5 checkpoints, beam 4, alpha 0.6, max len = src + 50
    big_ende:
      config: 'big: N=6, d_model=1024, d_ff=4096, h=16, P_drop=0.3, eps_ls=0.1, 300K
        steps (Table 3 bottom row)'
      data: WMT14 EN-DE, newstest2014 test
      inference: average last 20 checkpoints, beam 4, alpha 0.6, max len = src + 50
    big_enfr:
      config: big, P_drop=0.1 instead of 0.3 (Section 6.1, p8), 300K steps
      data: WMT14 EN-FR, newstest2014 test
      inference: average last 20 checkpoints, beam 4, alpha 0.6, max len = src + 50
    base_dev_newstest2013:
      config: base, 100K steps
      data: EN-DE development set newstest2013
      inference: beam search as in Section 6.1, NO checkpoint averaging
      perplexity_units: per-wordpiece under the BPE vocabulary (not comparable to
        per-word perplexity)
    big_dev_newstest2013:
      config: big, 300K steps, P_drop=0.3
      data: EN-DE development set newstest2013
      inference: beam search, no checkpoint averaging
    ablation_A_single_head:
      config: base but h=1, d_k=d_v=512 (amount of computation held constant, Section
        3.2.2/6.2)
      data: newstest2013 dev
      inference: beam search, no checkpoint averaging
    ablation_A_16_heads:
      config: base but h=16, d_k=d_v=32
      data: newstest2013 dev
      inference: beam search, no checkpoint averaging
    ablation_C_N2:
      config: base but N=2 layers (36M params per Table 3)
      data: newstest2013 dev
      inference: beam search, no checkpoint averaging
    ablation_D_no_dropout:
      config: base but P_drop=0.0 (eps_ls stays 0.1)
      data: newstest2013 dev
      inference: beam search, no checkpoint averaging
    ablation_E_learned_positions:
      config: base but learned positional embeddings [9] instead of sinusoids
      data: newstest2013 dev
      inference: beam search, no checkpoint averaging
    parsing_wsj_only:
      config: 4-layer Transformer, d_model=1024, 16K token vocabulary; dropout (attention
        and residual), learning rate and beam size tuned on WSJ Section 22, all other
        parameters unchanged from the EN-DE base model
      data: WSJ only (~40K sentences), discriminative; test on Section 23
      inference: beam 21, alpha 0.3, max output length = input length + 300
    parsing_semisupervised:
      config: 4-layer Transformer, d_model=1024, 32K token vocabulary; same tuning
        protocol as WSJ-only
      data: WSJ + high-confidence and BerkeleyParser corpora (~17M sentences); test
        on Section 23
      inference: beam 21, alpha 0.3, max output length = input length + 300
    reduced_transformer:
      config: 2-layer enc / 2-layer dec, d_model=128, d_ff=512, h=4, d_k=d_v=32, P_drop=0.1,
        eps_ls=0.1, sinusoidal PE, shared embeddings, post-norm
      optimizer: Adam(0.9, 0.98, 1e-9) with the paper's inverse-sqrt warmup schedule,
        warmup rescaled to run length
      budget: CPU only, fixed step count, <= 15 min wall clock, 3 seeds
      data: synthetic copy/reverse task (or <=20k-pair IWSLT-style subset)
      metrics: test loss, token accuracy, corpus BLEU
    reduced_no_attention_baseline:
      config: identical depth/width/parameter budget but all self-attention and cross-attention
        removed; fixed mean-pooled encoder context vector, position-wise FFN stacks
        only
      optimizer: identical optimizer, schedule, step count, and seeds as reduced_transformer
      data: same synthetic task and splits
      metrics: test loss, token accuracy, corpus BLEU
