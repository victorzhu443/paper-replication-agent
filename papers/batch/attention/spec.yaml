ambiguities:
- id: lr_schedule
  question: Which learning-rate schedule for the reduced-scale run?
  config_key: lr_schedule
  options:
  - constant
  - cosine
  - step
  - as_paper
  default: as_paper
  source: paper_text
  reason: Eq. (3) on p7 gives lrate = d_model^-0.5 * min(step^-0.5, step*warmup^-1.5)
    with warmup_steps=4000; we keep the same inverse-sqrt-with-warmup shape but must
    rescale warmup to the much shorter CPU run (see warmup_scaling ambiguity).
  sensitivity: high
- id: warmup_scaling
  question: With only a few thousand steps available, what warmup_steps value should
    be used?
  config_key: warmup_steps
  options:
  - 4000_as_paper
  - 10_percent_of_total_steps
  - '400'
  default: 10_percent_of_total_steps
  source: conventions_kb
  reason: Paper's 4000 warmup is 4% of its 100K base steps; holding 4000 in a ~2-4K
    step CPU run would mean the LR never decays. Scaling warmup to ~10% of total steps
    preserves the schedule shape.
  sensitivity: high
- id: attention_dropout
  question: What dropout rate (if any) is applied inside attention (on the softmax
    weights)?
  config_key: attention_dropout
  options:
  - '0.0'
  - same_as_residual_p_drop
  - tuned
  default: same_as_residual_p_drop
  source: paper_text
  reason: Section 5.4 (p7-8) announces 'three types of regularization' but describes
    only residual dropout and label smoothing; Section 6.3 (p9) refers to 'the dropout,
    both attention and residual (section 5.4)', so attention dropout exists but its
    rate is never printed. Code must pick one.
  sensitivity: medium
- id: perplexity_definition
  question: Is the reported dev perplexity computed from the label-smoothed objective
    or from unsmoothed cross-entropy?
  config_key: ppl_definition
  options:
  - unsmoothed_ce
  - smoothed_objective
  default: unsmoothed_ce
  source: paper_text
  reason: Table 3 (p9) says only that perplexities are per-wordpiece under the BPE
    vocabulary; Section 5.4 (p8) notes label smoothing 'hurts perplexity', implying
    perplexity of the model's own predictive distribution (unsmoothed CE). Never stated
    explicitly.
  sensitivity: medium
- id: length_penalty_definition
  question: Which length-penalty formula does alpha correspond to?
  config_key: length_penalty_form
  options:
  - gnmt_wu2016
  - divide_by_length_alpha
  - none
  default: gnmt_wu2016
  source: paper_text
  reason: Section 6.1 (p8) gives 'length penalty alpha = 0.6 [38]', citing GNMT (Wu
    et al. 2016), but does not write the formula; the GNMT lp(Y) = ((5+|Y|)/6)^alpha
    definition is implied.
  sensitivity: medium
- id: enfr_vocab_sharing
  question: Is the 32000 word-piece EN-FR vocabulary shared between source and target?
  config_key: vocab_sharing_enfr
  options:
  - shared
  - separate
  default: shared
  source: guess
  reason: Section 5.1 (p7) states a shared source-target vocabulary only for EN-DE
    BPE; for EN-FR it says only 'split tokens into a 32000 word-piece vocabulary'.
    Section 3.4 weight tying implies a single shared matrix, but the paper is silent.
  sensitivity: low
- id: base_enfr_config
  question: What dropout and step count were used for the base EN-FR model (Table
    2, BLEU 38.1)?
  config_key: base_enfr_config
  options:
  - same_as_base_ende_100k_pdrop0.1
  - pdrop_0.1_longer_schedule
  - unknown
  default: same_as_base_ende_100k_pdrop0.1
  source: paper_text
  reason: Section 5.2 (p7) says base models use 'the hyperparameters described throughout
    the paper' and were trained 100,000 steps; no EN-FR-specific base settings are
    reported, and the Table 2 base FLOPs figure is printed once spanning both language
    pairs.
  sensitivity: low
- id: checkpoint_interval_big
  question: At what interval were the big-model checkpoints written before averaging
    the last 20?
  config_key: checkpoint_interval
  options:
  - 10_minutes_as_base
  - unspecified_other
  default: 10_minutes_as_base
  source: paper_text
  reason: Section 6.1 (p8) states the 10-minute interval only in the sentence about
    base models ('last 5 checkpoints, which were written at 10-minute intervals');
    the interval for the big models' 20 checkpoints is not stated.
  sensitivity: low
- id: augmentation
  question: Any train-time data augmentation / noising?
  config_key: augmentation
  options:
  - none
  - standard
  - as_paper
  default: none
  source: paper_text
  reason: The paper never mentions augmentation for MT; Section 5.4 (p7-8) lists only
    dropout and label smoothing as described regularizers. Synthetic task pairs are
    freshly generated, which already provides sampling variety.
  sensitivity: low
- id: batch_vs_steps
  question: Hold fixed epochs or fixed optimizer steps when the batch size shrinks
    to CPU scale?
  config_key: batch_vs_steps
  options:
  - epochs
  - steps
  default: steps
  source: conventions_kb
  reason: Paper reports training length in steps (100K / 300K, Section 5.2) with ~25000
    source and ~25000 target tokens per batch (Section 5.1); at reduced scale the
    token budget cannot be matched, so hold a fixed step count under the 15-minute
    wall-clock cap and record tokens/step.
  sensitivity: medium
- id: mixed_precision
  question: Train in fp32 or with automatic mixed precision?
  config_key: mixed_precision
  options:
  - fp32
  - amp
  default: fp32
  source: conventions_kb
  reason: Paper estimates cost from 'sustained single-precision floating-point capacity'
    (p8 footnote 5), implying fp32; CPU-only runs have no AMP benefit anyway.
  sensitivity: low
- id: split
  question: Report the reduced-scale numbers on validation or test?
  config_key: split
  options:
  - validation
  - test
  default: test
  source: paper_text
  reason: Paper's headline Table 2 BLEU and Table 4 F1 are on test sets (newstest2014,
    WSJ Section 23) while Table 3 ablations are on dev (newstest2013). We mirror the
    headline convention and report held-out test, logging validation for model selection
    only.
  sensitivity: medium
- id: reduced_task_definition
  question: What exactly is the reduced-scale task (copy, reverse, or a real IWSLT
    subset)?
  config_key: reduced_task
  options:
  - copy
  - reverse
  - copy_and_reverse
  - iwslt_subset_20k
  default: reverse
  source: guess
  reason: Not in the paper; sequence reversal requires genuine long-range reordering,
    which stresses attention versus the no-attention baseline more than pure copy,
    while staying trainable in 15 CPU minutes.
  sensitivity: high
- id: bleu_implementation
  question: Which BLEU implementation and tokenization (tokenized multi-bleu vs sacreBLEU,
    smoothing)?
  config_key: bleu_tool
  options:
  - sacrebleu_13a
  - nltk_corpus_bleu_smoothed
  - multi_bleu_perl
  default: sacrebleu_13a
  source: conventions_kb
  reason: Paper gives no BLEU tool or tokenization for Table 2/Table 3; 2017-era numbers
    were tokenized multi-bleu. For the synthetic symbol task we use a single consistent
    corpus-BLEU implementation across Transformer and baseline so the comparison is
    internally valid.
  sensitivity: medium
- id: no_attention_baseline_form
  question: How should the 'no-attention' baseline be constructed?
  config_key: baseline_arch
  options:
  - mean_pooled_context_ffn
  - lstm_encdec_no_attention
  - conv_encdec
  default: mean_pooled_context_ffn
  source: guess
  reason: The paper's ablations (Table 3) never remove attention entirely; the cleanest
    control keeps depth/width/parameters and the training recipe fixed and deletes
    only the attention sub-layers, replacing cross-attention with a fixed mean-pooled
    encoder summary.
  sensitivity: high
- id: checkpoint_averaging
  question: Average the last k checkpoints at reduced scale?
  config_key: checkpoint_averaging
  options:
  - none
  - last_5
  - last_20
  default: none
  source: paper_text
  reason: Paper averages 5/20 checkpoints for Table 2 but explicitly uses 'no checkpoint
    averaging' for the Table 3 ablation grid (p9); the reduced run is an ablation-style
    comparison, so no averaging.
  sensitivity: low
- id: decode_beam
  question: Greedy or beam decoding for reduced-scale BLEU?
  config_key: beam_size
  options:
  - 1_greedy
  - 4_alpha_0.6
  default: 1_greedy
  source: conventions_kb
  reason: Paper uses beam 4 with alpha 0.6 (p8), but greedy is cheaper on CPU and
    sufficient for a short synthetic task; beam 4 / alpha 0.6 is run as a secondary
    check.
  sensitivity: medium
- id: weight_init
  question: Parameter initialization scheme?
  config_key: init
  options:
  - xavier_uniform
  - normal_0_0.02
  - framework_default
  default: xavier_uniform
  source: conventions_kb
  reason: Paper does not state initialization anywhere; tensor2tensor/standard Transformer
    implementations use Xavier/Glorot uniform with N(0, d_model^-0.5) embeddings.
  sensitivity: medium
- id: grad_clipping
  question: Is gradient clipping used?
  config_key: grad_clip
  options:
  - none
  - 1.0_global_norm
  default: none
  source: conventions_kb
  reason: Not mentioned in Section 5 (p7-8); the original Transformer recipe relies
    on the warmup schedule rather than clipping.
  sensitivity: low
- id: layernorm_placement
  question: Post-norm (as written) or pre-norm residual blocks?
  config_key: norm_placement
  options:
  - post_norm
  - pre_norm
  default: post_norm
  source: paper_text
  reason: Section 3.1 (p3) states LayerNorm(x + Sublayer(x)), i.e. post-norm; note
    that post-norm is less stable at very short warmup, which interacts with the warmup_scaling
    choice.
  sensitivity: medium
- id: label_smoothing_reduced
  question: Keep label smoothing 0.1 at reduced scale even though it distorts loss/perplexity
    comparisons?
  config_key: label_smoothing
  options:
  - 0.1_as_paper
  - '0.0'
  default: 0.1_as_paper
  source: paper_text
  reason: Paper uses eps_ls=0.1 and warns it hurts perplexity while improving accuracy
    and BLEU (Section 5.4, p8); we keep it but report unsmoothed cross-entropy separately
    so the reported loss is comparable to the baseline.
  sensitivity: medium
- id: seed_count
  question: How many seeds for the reduced-scale comparison?
  config_key: n_seeds
  options:
  - '1'
  - '3'
  - '5'
  default: '3'
  source: conventions_kb
  reason: Paper reports single runs with no variance or seed information; 3 seeds
    is the minimum needed to report a std for the Transformer-vs-no-attention gap
    within the compute budget.
  sensitivity: medium
- id: enfr_bleu_reference
  question: 'Which printed EN-FR big-model BLEU is authoritative: 41.8 (Table 2 /
    abstract) or 41.0 (Section 6.1 text)?'
  config_key: enfr_reference_value
  options:
  - 41.8_table2
  - 41.0_text
  default: 41.8_table2
  source: paper_text
  reason: Table 2 (p8) prints 41.8 and the abstract (p1) also says 41.8, while the
    Section 6.1 narrative (p8) says 41.0; the table/abstract value is taken as the
    claim. This claim is Untested at this compute tier regardless.
  sensitivity: low
- id: paper_scale_untested
  question: How to record paper-scale WMT14/PTB claims that cannot be executed?
  config_key: claim_status
  options:
  - untested
  - attempt_partial
  - proxy_extrapolation
  default: untested
  source: conventions_kb
  reason: CPU tier 2 with a 15-minute budget cannot train on 4.5M/36M sentence pairs;
    Table 2, Table 3 and Table 4 claims are marked Untested and only the reduced-scale
    synthetic-task metrics plus the no-attention comparison are verified.
  sensitivity: high
