data:
  sources:
  - canonical: glue_sst2
    description: SST-2 sentiment classification from GLUE (Socher et al. 2013; Wang
      et al. 2019). Backs the headline claims in Table 2. The paper trains on the
      FULL SST-2 training split (67,349 examples; size not stated in the paper) and
      reports validation accuracy; any train subsetting is a replication deviation
      (see ambiguity train_subset_size).
    substitute: null
  - canonical: glue_benchmark
    description: Full GLUE suite (MNLI, SST-2, MRPC, CoLA, QNLI, QQP, RTE, STS-B)
      used for the RoBERTa/DeBERTa results in Table 2; MNLI reported as overall matched+mismatched
      accuracy, CoLA as Matthew's correlation, STS-B as Pearson correlation, accuracy
      for the rest.
    substitute: null
  - canonical: e2e_nlg
    description: 'E2E NLG Challenge (Novikova et al. 2017): ~42,000 train / 4,600
      validation / 4,600 test restaurant-domain data-to-text examples, multiple references
      per input (Table 3, Table 18).'
    substitute: null
  - canonical: wikisql
    description: WikiSQL NL-to-SQL (Zhong et al. 2017), 56,355 train / 8,421 validation
      examples; context x = {table schema, query}, target y = {SQL}; metric is logical-form
      validation accuracy (Tables 4, 5, 6, 15).
    substitute: null
  - canonical: samsum
    description: SAMSum dialogue summarization (Gliwa et al. 2019), 14,732 train /
      819 test examples; Rouge-1/2/L reported in Table 4.
    substitute: null
  - canonical: hf_pretrained_roberta_base
    description: HuggingFace RoBERTa base (125M) checkpoint; frozen base model for
      the Table 2 top section and the headline SST-2 claims.
    substitute: null
  - canonical: hf_pretrained_roberta_large
    description: HuggingFace RoBERTa large (355M) checkpoint; Table 2 middle sections,
      including the dagger-marked adapter-matched runs.
    substitute: null
  - canonical: hf_pretrained_deberta_xxl
    description: DeBERTa XXL (1.5B) checkpoint (He et al. 2021); Table 2 bottom section.
    substitute: null
  - canonical: hf_pretrained_gpt2_medium
    description: GPT-2 medium checkpoint; frozen base model for Table 3 / Table 18
      E2E results and the Table 1 latency study.
    substitute: null
  - canonical: hf_pretrained_gpt2
    description: HuggingFace GPT-2 small (124M). NOT used anywhere in the paper; listed
      only as an optional reduced-scale proxy base model for a CPU-budget replication
      (see ambiguity base_model).
    substitute: null
  - canonical: gpt3_175b_checkpoint
    description: Proprietary GPT-3 175B pretrained weights (Tables 4-7, 15-17); not
      publicly available, so those claims are not independently reproducible.
    substitute: null
  universe:
    headline_task: SST-2 binary sentiment classification (GLUE), RoBERTa base, LoRA
      vs full fine-tuning (Table 2 top section)
    headline_base_model: RoBERTa base (125M) with a randomly initialized sequence-classification
      head; pretrained weights frozen for LoRA
    headline_methods: LoRA rq = rv = 8, alpha = 8 on Wq and Wv of every Transformer
      layer (Table 9) vs full fine-tuning of all parameters (FT row cited from prior
      work)
    paper_models: RoBERTa base/large, DeBERTa XXL, GPT-2 medium/large, GPT-3 175B
    paper_adapted_weights: attention weights only (Wq, Wv in most experiments); MLP
      modules, LayerNorm layers and biases frozen (Section 4.2)
    reduced_scale_proxy: 'Optional CPU proxy NOT in the paper: GPT-2 small 124M with
      a classification head on SST-2; cannot be compared numerically to the Table
      2 claims'
    compute_note: Paper used NVIDIA Tesla V100 GPUs for all training experiments and
      an NVIDIA Quadro RTX8000 for the Table 1 latency measurements; paper configs
      (e.g. 60 epochs on SST-2) are not feasible on a CPU-minute budget
  frequency: not applicable (single training run per configuration + one-shot evaluation
    on the held-out split)
  preprocessing:
    tokenizer: 'base-model tokenizer: RoBERTa byte-level BPE for RoBERTa runs, DeBERTa
      tokenizer for DeBERTa, GPT-2 byte-level BPE for GPT-2 runs (pad token set to
      eos for GPT-2). Paper does not state padding/truncation details.'
    max_sequence_length: 512 for RoBERTa base on all GLUE tasks (Table 9); 128-512
      per task for RoBERTa large non-dagger; 128 for all dagger (adapter-matched)
      runs; 64-512 per task for DeBERTa XXL (Table 10); 384 WikiSQL / 768 MNLI / 2048
      SAMSum for GPT-3 (Appendix D.4)
    train_set: full task training split (paper); the GPT-3 low-data study additionally
      uses random MNLI subsets of 100/1k/10k examples (Appendix F.3)
    labels: SST-2 binary {negative=0, positive=1} as shipped by HF datasets glue/sst2
    lora_init: A ~ N(0, sigma^2) random Gaussian, B = 0 so BA = 0 at initialization;
      update scaled by alpha/r with alpha fixed and not tuned (Section 4.1)
    frozen_weights: all pretrained weights frozen for LoRA runs (including for the
      MNLI-transfer tasks); the newly initialized task head must be trained and is
      excluded from the paper's |Theta| formula
  splits:
    train: full SST-2 training split for the headline claims (paper); 67,349 examples
      in HF glue/sst2 (size not stated in the paper)
    eval: SST-2 validation split (872 examples in HF glue/sst2; size not stated in
      the paper). GLUE test labels are not public and the paper reports validation/dev
      numbers.
    paper_other_splits: WikiSQL 56,355 train / 8,421 val; SAMSum 14,732 train / 819
      test; E2E ~42,000 train / 4,600 val / 4,600 test; MNLI full 392K train with
      full validation set for evaluation
    model_selection: 'RoBERTa/DeBERTa: median over 5 random seeds, result for each
      run taken from the best epoch (Appendix D.1/D.2). GPT-2: mean over 3 random
      seeds, best epoch (Appendix D.3). GPT-3: best validation performance from each
      run (Appendix D.4). No separate held-out selection split is described.'
method:
  signal: 'Freeze pretrained weight matrix W0 and learn a low-rank update dW = BA
    (B in R^{d x r} initialized to 0, A in R^{r x k} initialized N(0, sigma^2)) applied
    in parallel to the frozen weights: h = W0 x + (alpha/r) B A x. Only A and B (plus
    the task head) are trained; at inference BA can be merged into W0 so no extra
    latency is introduced.'
  model:
    base_model_primary: RoBERTa base (125M) from HuggingFace with a randomly initialized
      classification head (Section 5.2, Table 2 top section) -- the model behind the
      headline SST-2 claims
    base_model_proxy: GPT2ForSequenceClassification from gpt2 (124M) via transformers
      + peft; reduced-scale proxy NOT used in the paper (see ambiguity base_model)
    lora_rank_r: rq = rv = 8 for RoBERTa base/large (Table 9) and DeBERTa XXL (Table
      10); rq = rv = 4 for GPT-2 on E2E/WebNLG/DART (Table 11); GPT-3 varies by experiment
      (Tables 5, 6, 15, 17)
    lora_target_modules: Wq and Wv only in most experiments (Sections 4.2 and 5.1),
      applied in every Transformer layer (e.g. all 96 layers for GPT-3, Section 7.1).
      For GPT-2's fused c_attn the q/v slices must be selected (paper silent).
    lora_alpha: 8 for RoBERTa base (Table 9), 16 for RoBERTa large and the dagger
      runs (Table 9), 8 for DeBERTa XXL (Table 10), 32 for GPT-2 on E2E/WebNLG/DART
      (Table 11); scaling factor alpha/r
    lora_dropout: not reported for RoBERTa/DeBERTa LoRA (Tables 9-10 list no LoRA
      dropout; DeBERTa SST-2 CLS dropout = 0); 0.1 for GPT-2 on E2E and WebNLG, 0.0
      on DART (Table 11)
    init: A random Gaussian, B zeros; for MRPC/RTE/STS-B the RoBERTa and DeBERTa LoRA
      modules are initialized from the authors' best MNLI LoRA checkpoint (Appendix
      D.1/D.2), except the dagger runs which start from the plain pretrained model
    optimizer: AdamW (Appendix D.1-D.4)
    lr_schedule: linear decay; warmup ratio 0.06 for RoBERTa (Table 9), 0.1 for DeBERTa
      XXL (Table 10), 500 warmup steps for GPT-2 (Table 11), 250,000 warmup tokens
      for GPT-3 (Tables 12, 17)
    learning_rate_headline: 5E-04 for RoBERTa base LoRA on SST-2 (Table 9); learning
      rate, epochs and batch size were swept for LoRA
    batch_and_epochs_headline: batch size 16, 60 epochs for RoBERTa base LoRA on SST-2
      (Table 9)
    full_ft_baseline: all parameters updated; the RoBERTa/DeBERTa FT rows in Table
      2 are numbers published in prior works (asterisk), so this paper gives no FT
      hyperparameters. GPT-3 FT uses AdamW lr 5.00E-06, batch 128, 2 epochs, weight
      decay 0.1 (Table 12).
    param_accounting: '|Theta| = 2 * L_LoRA * d_model * r for LoRA modules (Section
      5.1); adapter baselines |Theta| = L_Adpt*(2*d_model*r + r + d_model) + 2*L_LN*d_model;
      the task head is not included in these formulas'
    merging: for deployment/latency measurement W = W0 + BA is computed explicitly,
      so LoRA inference cost equals the fine-tuned model (Section 4.1, Table 1)
  evaluation:
  - classification accuracy on the SST-2 validation split (headline)
  - per-task GLUE metrics and their unweighted average (accuracy; Matthew's correlation
    for CoLA; Pearson correlation for STS-B; overall matched+mismatched accuracy for
    MNLI)
  - trainable-parameter count (millions) per method
  - E2E NLG BLEU/NIST/METEOR/ROUGE-L/CIDEr for GPT-2 runs; validation loss for the
    Table 18 rank sweep
  - WikiSQL logical-form validation accuracy, MNLI-matched validation accuracy, SAMSum
    Rouge-1/2/L for GPT-3 runs
  - single-forward-pass inference latency in milliseconds (Table 1, Appendix B)
  eval_protocol:
    primary_metric: accuracy (percent) on the SST-2 validation split
    reported_statistic: 'RoBERTa/DeBERTa: median over 5 random seeds, best epoch per
      run; GPT-2: mean over 3 random seeds, best epoch per run; GPT-3: best validation
      performance per run'
    error_bars: Table 2 reports +/- values without defining them; Table 3 caption
      calls its +/- values confidence intervals; Tables 4/5/6 report one task-level
      seed fluctuation (WikiSQL +/-0.5%, MNLI-m +/-0.1%, SAMSum +/-0.2/+/-0.2/+/-0.1);
      Appendix F.3 states +/-0.3 for MNLI subsets
    n_eval_examples: SST-2 validation = 872 (split size not stated in the paper);
      WikiSQL validation = 8,421; E2E test = 4,600
    tolerance_basis: paper-reported seed spread for the matching row (e.g. +/-0.2
      for RoBbase LoRA SST-2) together with the printed precision (0.05 for one-decimal
      numbers); no additional slack
    latency_protocol: average of 100 trials of a single forward pass on an NVIDIA
      Quadro RTX8000, GPT-2 medium, no model parallelism (Table 1, Appendix B)
  variants:
    roberta_base_lora:
      model: RoBERTa base 125M (HuggingFace), pretrained weights frozen
      method: LoRA rq = rv = 8, alpha = 8, on Wq and Wv of every layer
      seq_len: 512 for all GLUE tasks (Table 9)
      sst2_hparams: batch size 16, 60 epochs, lr 5E-04, AdamW, linear schedule, warmup
        ratio 0.06 (Table 9)
      reported: median over 5 seeds, result of each run taken from the best epoch
        (Appendix D.1)
      init_for_mrpc_rte_stsb: LoRA modules initialized from the authors' best MNLI
        LoRA checkpoint; base model stays frozen
      trainable_params: 0.3M (excludes the classification head)
    roberta_base_ft:
      model: RoBERTa base 125M
      method: full fine-tuning of all 125.0M parameters
      source: numbers published in prior works (asterisk row in Table 2); no hyperparameters
        given in this paper
    roberta_large_lora:
      model: RoBERTa large 355M
      method: LoRA rq = rv = 8, alpha = 16 (Table 9)
      sst2_hparams: batch size 4, 10 epochs, lr 4E-04, max seq len 128 (Table 9)
      seq_len: per-task 128-512 for the non-dagger row
      init_for_mrpc_rte_stsb: from best MNLI LoRA checkpoint (non-dagger row only)
      reported: median over 5 seeds, best epoch
      trainable_params: 0.8M
    roberta_large_lora_dagger:
      model: RoBERTa large 355M
      method: LoRA rq = rv = 8, alpha = 16, batch size 4, max seq len 128 for all
        tasks (Table 9)
      restriction: 'Houlsby-style fair-comparison setup: fixed batch size, seq len
        128, and initialization from the plain pretrained model (no MNLI transfer)
        for MRPC, RTE, STS-B'
      table2_row: '''RoBlarge (LoRA)+'' 0.8M (Avg. 88.6)'
    roberta_large_ft:
      model: RoBERTa large 355M
      method: full fine-tuning (355.0M params)
      source: prior published numbers (asterisk row)
    deberta_xxl_lora:
      model: DeBERTa XXL 1.5B
      method: LoRA rq = rv = 8, alpha = 8 (Table 10)
      hparams: AdamW, linear schedule, warmup ratio 0.1; per-task batch size, epochs,
        lr, weight decay, CLS dropout and max seq len per Table 10
      init_for_mrpc_rte_stsb: from best MNLI LoRA checkpoint (Appendix D.2)
      reported: median over 5 seeds, best epoch
      trainable_params: 4.7M
    deberta_xxl_ft:
      model: DeBERTa XXL 1.5B
      method: full fine-tuning (1500.0M params)
      source: prior published numbers (asterisk row)
    gpt2_medium_lora:
      model: GPT-2 medium
      method: LoRA rq = rv = 4, alpha = 32 (Table 11)
      dataset: E2E NLG Challenge
      training: AdamW, lr 2E-04, batch size 8, 5 epochs, 500 warmup steps, linear
        schedule, weight decay 0.01, dropout 0.1, label smoothing 0.1 (Table 11)
      inference: beam size 10, length penalty 0.9, no-repeat-ngram size 4 (Table 11)
      reported: mean over 3 random seeds, best epoch (Appendix D.3)
      trainable_params: 0.35M
    gpt2_medium_ft:
      model: GPT-2 medium
      method: full fine-tuning (354.92M params)
      source: Li & Liang (2021) published numbers (asterisk row)
    gpt2_medium_lora_rank_sweep:
      model: GPT-2 medium
      method: LoRA on Wq, Wv with r in {1,2,4,8,16,32,64,128,256,512,1024}
      training: 26,000 steps on E2E (Appendix H.2); other hyperparameters tuned at
        r = 4 and reused
      reported: validation loss and test-set metrics, single run per r (no seed spread
        reported)
    gpt3_ft:
      model: GPT-3 175B (proprietary weights)
      method: full fine-tuning, AdamW lr 5.00E-06, batch size 128, 2 epochs, weight
        decay 0.1, 250,000 warmup tokens, linear schedule (Table 12)
      seq_len: 384 WikiSQL / 768 MNLI / 2048 SAMSum (Appendix D.4)
      reported: best validation performance per run
    gpt3_lora_4p7M:
      model: GPT-3 175B
      method: LoRA at the 4.7M budget; Appendix D.4 says this budget is 'rq = rv =
        1 or rv = 2', and the Table 4 numbers (WikiSQL 73.4, MNLI-m 91.7) match the
        rv = 2 row of Table 15 (rq = rv = 1 gives 73.4 / 91.3)
      training: AdamW lr 2.00E-04, batch 128, 2 epochs, weight decay 0.1, 250,000
        warmup tokens (Table 12)
      reported: best validation performance from each run
    gpt3_lora_weight_type_budget18M:
      model: GPT-3 175B, 96 layers
      budget: 18M trainable parameters (~35MB in FP16) held fixed
      variation: 'which attention matrices are adapted: Wq / Wk / Wv / Wo at r = 8;
        {Wq,Wk} and {Wq,Wv} at r = 4; {Wq,Wk,Wv,Wo} at r = 2 (Table 5)'
      reported: single number per cell; task-level seed std in the first column (WikiSQL
        +/-0.5%, MultiNLI +/-0.1%)
    gpt3_lora_rank_sweep:
      model: GPT-3 175B
      variation: rank r in {1,2,4,8,64} for Wq, {Wq,Wv}, and {Wq,Wk,Wv,Wo} (Table
        6; the Section 7.2 text writes Wc where the table reads Wo)
      reported: single number per cell; task-level seed std WikiSQL +/-0.5%, MultiNLI
        +/-0.1%
    gpt3_lora_lowdata:
      model: GPT-3 175B
      method: LoRA rq = rv = 8, lr 2.00E-04 (Table 17)
      dataset: random MNLI subsets of 100 / 1k / 10k training examples plus full 392K;
        evaluated on the full MNLI-matched validation set
      schedule: 'MNLI-100: batch 20, 40 epochs; MNLI-1k: batch 20, 40 epochs; MNLI-10k:
        batch 100, 4 epochs; MNLI-392K: batch 128, 2 epochs (Table 17)'
      seed_variance: +/-0.3 stated in Appendix F.3
    gpt3_ft_lowdata:
      model: GPT-3 175B
      method: full fine-tuning, lr 5.00E-6 (Table 17)
      dataset: MNLI subsets 100 / 1k / 10k / 392K, same batch/epoch schedule as the
        LoRA low-data runs
    gpt2_medium_lora_merged_inference:
      measurement: single forward-pass latency in ms with LoRA merged into W0, identical
        to the fine-tuned model ('Fine-Tune/LoRA' row of Table 1)
      hardware: NVIDIA Quadro RTX8000, average over 100 trials, no model parallelism
      configs: (batch 32, seq 512), (batch 16, seq 256), (batch 1, seq 128)
    adapter_h_inference:
      measurement: single forward-pass latency in ms with Houlsby-style adapters (two
        adapter layers per block); |Theta| = 11M for the batch-1/seq-128 column
      hardware: NVIDIA Quadro RTX8000, average over 100 trials
    lora_r4_qv_gpt2_small_proxy:
      status: reduced-scale proxy NOT present in the paper; not comparable to any
        claim value
      model: GPT-2 small 124M with sequence-classification head
      method: LoRA r = 4 on the q and v slices of c_attn
      dataset: SST-2
    full_finetune_gpt2_small_proxy:
      status: reduced-scale proxy NOT present in the paper; not comparable to any
        claim value
      model: GPT-2 small 124M
      method: full fine-tuning, all parameters updated
      dataset: SST-2
baselines:
- full fine-tuning (FT) of all parameters
- fine-tune top-2 layers only (FT^Top2), from Li & Liang (2021)
- BitFit (bias-only tuning)
- prefix-embedding tuning (PreEmbed), |Theta| = d_model*(lp+li)
- prefix-layer tuning (PreLayer), |Theta| = L*d_model*(lp+li)
- Adapter^H (Houlsby et al., 2019)
- Adapter^L (Lin et al., 2020)
- Adapter^P (Pfeiffer et al., 2021)
- AdapterDrop (Adapter^D, Ruckle et al., 2020)
- GPT-3 few-shot, no parameter updates (Table 8)
- LoRA+PrefixEmbed and LoRA+PrefixLayer combinations (Appendix E, Table 15)
ambiguities:
- id: base_model
  question: Which frozen base model backs the headline SST-2 LoRA-vs-FT claims?
  config_key: base_model
  options:
  - roberta_base_125m_as_paper
  - gpt2_small_124m_proxy
  default: roberta_base_125m_as_paper
  source: paper_text
  reason: Section 5.2 and Table 2 state the 95.1/94.8 SST-2 numbers are RoBERTa base
    (125M) from HuggingFace. The paper never uses GPT-2 for classification, so a GPT-2
    small proxy cannot be checked against these claim values.
  sensitivity: high
- id: train_subset_size
  question: Is the full SST-2 training split used, or a reduced subset?
  config_key: train_subset_size
  options:
  - full_train_split
  - 2000_examples
  - 10000_examples
  default: full_train_split
  source: paper_text
  reason: The paper trains on the full GLUE training splits for Table 2; its only
    subsetting experiment is MNLI-100/1k/10k on GPT-3 (Appendix F.3). Subsetting SST-2
    changes the claim target.
  sensitivity: high
- id: subset_sampling
  question: If a reduced training subset is used, how are its examples drawn from
    SST-2?
  config_key: train_subset_sampling
  options:
  - first_n
  - random_seed0
  - stratified_random_seed0
  default: stratified_random_seed0
  source: guess
  reason: Not in the paper for SST-2; Appendix F.3 only says MNLI subsets were 'randomly
    sampled'. Stratified sampling with a fixed seed preserves label balance and reproducibility.
  sensitivity: medium
- id: num_epochs
  question: How many training epochs for RoBERTa base LoRA on SST-2?
  config_key: num_epochs
  options:
  - '60'
  - '10'
  - '3'
  default: '60'
  source: paper_text
  reason: Table 9 lists 60 epochs for RoBERTa base LoRA on SST-2 (batch size 16, lr
    5E-04). Any shorter schedule is a compute-driven deviation.
  sensitivity: high
- id: batch_vs_steps
  question: If the run must be shortened, hold epochs fixed or optimizer steps fixed
    across LoRA and full FT?
  config_key: batch_vs_steps
  options:
  - epochs
  - steps
  default: steps
  source: conventions_kb
  reason: The paper's SST-2 configuration (60 epochs, Table 9) is infeasible on a
    short CPU budget; a matched optimizer-step budget keeps the LoRA-vs-FT comparison
    internally fair. The paper does not discuss step matching.
  sensitivity: high
- id: lr_schedule
  question: What learning-rate schedule and warmup?
  config_key: lr_schedule
  options:
  - constant
  - cosine
  - step
  - as_paper
  default: as_paper
  source: paper_text
  reason: 'Appendix D / Table 9: AdamW with linear decay and warmup ratio 0.06 for
    RoBERTa (0.1 for DeBERTa; 500 warmup steps for GPT-2; 250,000 warmup tokens for
    GPT-3). ''as_paper'' = linear decay with 6% warmup for the RoBERTa headline run.'
  sensitivity: medium
- id: learning_rates
  question: What learning rates for the LoRA run and for the full fine-tuning run?
  config_key: learning_rate
  options:
  - lora=5e-4,ft=2e-5
  - lora=5e-4,ft=1e-5
  - lora=2e-4,ft=5e-6
  - swept
  default: lora=5e-4,ft=2e-5
  source: paper_text
  reason: Table 9 gives lr 5E-04 for RoBERTa base LoRA on SST-2. The RoBERTa FT row
    is cited from prior work, so this paper states no FT learning rate; 2e-5 is conventional
    for full fine-tuning a 125M encoder.
  sensitivity: high
- id: batch_size
  question: What training batch size?
  config_key: batch_size
  options:
  - '8'
  - '16'
  - '32'
  default: '16'
  source: paper_text
  reason: 'Table 9: batch size 16 for RoBERTa base LoRA on SST-2; kept identical for
    the FT baseline since the paper gives no FT batch size.'
  sensitivity: medium
- id: max_seq_len
  question: What maximum sequence length for SST-2 tokenization?
  config_key: max_seq_len
  options:
  - '64'
  - '128'
  - '512'
  default: '512'
  source: paper_text
  reason: Table 9 sets max seq len 512 for RoBERTa base on all GLUE tasks; 128 is
    used only for the adapter-matched dagger runs (RoBERTa large).
  sensitivity: low
- id: lora_rank
  question: What LoRA rank r for the headline SST-2 run?
  config_key: lora_rank
  options:
  - '4'
  - '8'
  - '16'
  default: '8'
  source: paper_text
  reason: Table 9 specifies rq = rv = 8 for RoBERTa base LoRA on all GLUE tasks; r
    = 4 is the GPT-2/E2E setting (Table 11) and does not apply here.
  sensitivity: medium
- id: lora_alpha
  question: What LoRA alpha (scaling alpha/r) for the headline SST-2 run?
  config_key: lora_alpha
  options:
  - '4'
  - '8'
  - '16'
  - '32'
  default: '8'
  source: paper_text
  reason: Table 9 gives LoRA alpha = 8 for RoBERTa base (16 for RoBERTa large, 8 for
    DeBERTa XXL in Table 10, 32 for GPT-2 on E2E in Table 11). Section 4.1 says alpha
    is set to the first r tried and not tuned.
  sensitivity: medium
- id: lora_target_modules
  question: Which weight matrices receive LoRA, and how is this realized in fused
    projections?
  config_key: lora_target_modules
  options:
  - q_v_only
  - q_v_slices_of_c_attn
  - whole_c_attn
  - q_k_v_o
  - q_only
  default: q_v_only
  source: paper_text
  reason: Sections 4.2 and 5.1 state LoRA is applied to Wq and Wv only (MLP, LayerNorm
    and biases frozen). For GPT-2, q/k/v are fused into c_attn, so slicing out q and
    v is an implementation choice the paper does not describe.
  sensitivity: medium
- id: lora_layer_coverage
  question: Is LoRA injected in every Transformer layer or only a subset?
  config_key: lora_layer_coverage
  options:
  - all_layers
  - top_half
  - last_two_layers
  default: all_layers
  source: paper_text
  reason: Abstract and Section 7.1 describe injecting rank-decomposition matrices
    into each layer (e.g. all 96 layers of GPT-3 for the 18M budget); the 0.3M count
    for RoBERTa base is consistent with all 12 layers at r = 8 on Wq and Wv.
  sensitivity: medium
- id: lora_dropout
  question: What dropout probability is applied inside the LoRA path?
  config_key: lora_dropout
  options:
  - '0.0'
  - '0.05'
  - '0.1'
  default: '0.0'
  source: conventions_kb
  reason: Tables 9-10 list no LoRA dropout for RoBERTa/DeBERTa (DeBERTa SST-2 CLS
    dropout is 0); 0.1 appears only for GPT-2 on E2E/WebNLG (Table 11). Library default
    is 0.0.
  sensitivity: low
- id: weight_decay
  question: What weight decay for AdamW in the headline SST-2 runs?
  config_key: weight_decay
  options:
  - '0.0'
  - '0.01'
  - '0.1'
  default: '0.01'
  source: conventions_kb
  reason: Not listed for RoBERTa in Table 9; Table 10 uses 0 or 0.01 per task for
    DeBERTa, Table 11 uses 0.01 for GPT-2 on E2E, and GPT-3 uses 0.1 (Appendix D.4).
    0.01 is the AdamW default and matches the GPT-2 setting.
  sensitivity: low
- id: n_seeds
  question: How many random seeds per configuration and what aggregate statistic?
  config_key: n_seeds
  options:
  - '1'
  - 3_mean
  - 3_median
  - 5_median
  default: 5_median
  source: paper_text
  reason: 'Appendix D.1/D.2: median over 5 random seeds for RoBERTa and DeBERTa (the
    protocol behind the headline SST-2 claim); mean over 3 seeds is the GPT-2 protocol
    (D.3).'
  sensitivity: medium
- id: checkpoint_selection
  question: Report the final-step model or the best-epoch model?
  config_key: checkpoint_selection
  options:
  - final_step
  - best_epoch_on_eval
  default: best_epoch_on_eval
  source: paper_text
  reason: Appendix D.1/D.2 state 'the result for each run is taken from the best epoch',
    and the only reported split is the validation split; deviating to final-step changes
    the reported quantity, so the paper's choice is kept and the leakage is logged
    as a caveat.
  sensitivity: medium
- id: error_bar_semantics
  question: What do the +/- values in Tables 2 and 3 represent?
  config_key: error_bar_semantics
  options:
  - std_over_seeds
  - 95pct_ci
  - range
  default: std_over_seeds
  source: paper_text
  reason: Table 2's caption does not define its +/- values while Table 3's caption
    calls them 'confidence intervals'; the spec stores them in reported_std, so the
    interpretation must be recorded rather than assumed identical.
  sensitivity: low
- id: split
  question: Which split provides the reported accuracy?
  config_key: split
  options:
  - validation
  - test
  default: validation
  source: paper_text
  reason: GLUE test labels are not public; Tables 4-6 explicitly say 'validation accuracy'
    and Table 2 reports dev-set metrics, so the replication reports SST-2 validation
    accuracy.
  sensitivity: high
- id: mnli_metric
  question: For MNLI in Table 2, is the metric matched-only or the overall matched+mismatched
    accuracy?
  config_key: mnli_metric
  options:
  - overall_m_and_mm_accuracy
  - matched_only
  default: overall_m_and_mm_accuracy
  source: paper_text
  reason: Table 2's caption states 'the overall (matched and mismatched) accuracy
    for MNLI'; Table 4 for GPT-3 instead reports MultiNLI-matched only, so the two
    must not be conflated.
  sensitivity: medium
- id: glue_avg_definition
  question: How is the GLUE 'Avg.' column computed?
  config_key: glue_avg_definition
  options:
  - unweighted_mean_of_eight_task_metrics
  - example_weighted_mean
  default: unweighted_mean_of_eight_task_metrics
  source: conventions_kb
  reason: The paper does not define the Avg. column, but the simple unweighted mean
    of the eight printed RoBbase (LoRA) numbers gives 87.24 -> 87.2, matching the
    table.
  sensitivity: low
- id: wikisql_accuracy_definition
  question: Which WikiSQL accuracy is reported?
  config_key: wikisql_accuracy
  options:
  - logical_form
  - execution
  default: logical_form
  source: paper_text
  reason: Table 4's caption says 'logical form validation accuracy on WikiSQL'; execution
    accuracy would give different numbers.
  sensitivity: medium
- id: gpt3_lora_4p7m_config
  question: Which LoRA configuration is the 4.7M row of Table 4?
  config_key: gpt3_lora_4p7m_config
  options:
  - rv_2
  - rq_rv_1
  default: rv_2
  source: paper_text
  reason: Appendix D.4 says the 4.7M budget is 'rq = rv = 1 or rv = 2'; Table 15 shows
    rv = 2 gives 73.4 / 91.7 and rq = rv = 1 gives 73.4 / 91.3, and Table 4 reports
    91.7, so rv = 2 is the matching configuration.
  sensitivity: medium
- id: e2e_eval_script
  question: Which scorer computes the E2E BLEU/NIST/METEOR/ROUGE-L/CIDEr numbers?
  config_key: e2e_eval_script
  options:
  - official_e2e_metrics_script
  - sacrebleu
  - nltk_bleu
  default: official_e2e_metrics_script
  source: conventions_kb
  reason: The paper says only that it follows Li & Liang (2021) and never names a
    scorer; BLEU values differ materially between the official multi-reference E2E
    script and sacrebleu/nltk.
  sensitivity: high
- id: classification_head_treatment
  question: Is the newly initialized classification head trainable, and is it counted
    in the trainable-parameter total?
  config_key: head_treatment
  options:
  - trainable_and_counted
  - trainable_not_counted
  - frozen
  default: trainable_not_counted
  source: paper_text
  reason: A randomly initialized head must be trained, but the paper's |Theta| = 2*L*d_model*r
    formula and the 0.3M figure for RoBERTa base exclude the task head, so matching
    the reported parameter count requires excluding it while still training it.
  sensitivity: medium
- id: param_fraction_denominator
  question: Which denominator defines the 'trainable-parameter fraction'?
  config_key: param_fraction_denominator
  options:
  - all_base_params_incl_embeddings
  - transformer_block_params_only
  default: all_base_params_incl_embeddings
  source: paper_text
  reason: The paper compares |Theta| to |Phi0|, all pretrained parameters (0.3M vs
    125.0M for RoBERTa base; 4.7M vs 175,255.8M for GPT-3), implying embeddings are
    in the denominator.
  sensitivity: low
- id: mnli_transfer_init
  question: Are MRPC/RTE/STS-B LoRA runs initialized from an MNLI checkpoint?
  config_key: mnli_transfer_init
  options:
  - mnli_init_for_mrpc_rte_stsb
  - pretrained_init_only
  default: mnli_init_for_mrpc_rte_stsb
  source: paper_text
