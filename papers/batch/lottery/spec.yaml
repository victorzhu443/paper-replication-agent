  options:
  - fresh_gaussian_glorot_per_layer
  - shuffle_surviving_init_values
  - sample_from_ticket_distribution
  default: fresh_gaussian_glorot_per_layer
  source: paper_text
  reason: Section 2 defines the control as theta_0' ~ D_theta, the same Gaussian Glorot
