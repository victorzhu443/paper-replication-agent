  config_key: validation_split_seed
  options:
  - fixed_seed_0_random_sample
  - last_5000_of_train
  - per_trial_random_sample
  default: fixed_seed_0_random_sample
  source: guess
  reason: Appendices G.1 and H.1 say the 5,000-example validation set was randomly
