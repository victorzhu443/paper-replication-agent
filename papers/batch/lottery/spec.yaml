  options:
  - 5_trials_3_reinits
  - 3_trials_1_reinit
  - 1_trial
  default: 5_trials_3_reinits
  source: paper_text
  reason: 'Figures 3-5 captions: main-body curves average five trials; reinit curves
    average fifteen runs (three reinitializations per trial). Appendix sweeps use
    three trials (Appendix G.1, H.1).'
  sensitivity: medium
- id: early_stopping_criterion
  question: How is the early-stopping iteration determined and how often is validation
