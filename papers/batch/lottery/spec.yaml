data:
  sources:
  - canonical: mnist
    description: 'MNIST handwritten digits (LeCun et al., 1998): 60,000 training and
      10,000 test 28x28 grayscale images, 10 classes. Used for all Lenet-300-100 lottery
      ticket experiments (Section 2, Appendices B-G).'
    substitute: torchvision
  - canonical: cifar10
    description: 'CIFAR10 (Krizhevsky & Hinton, 2009): 50,000 training and 10,000
      test 32x32 color images, 10 classes. Required for the Conv-2/4/6 claims (Section
      3, Appendix H) and the VGG-19 / Resnet-18 claims (Section 4, Appendix I), all
      of which appear in this spec.'
    substitute: torchvision
  universe:
    primary_task: 10-class image classification (MNIST) with Lenet-300-100 fully-connected
      network (784-300-100-10, 266K weights)
    secondary_tasks: CIFAR10 classification with Conv-2 (4.3M total / 38K conv), Conv-4
      (2.4M / 260K conv), Conv-6 (1.7M / 1.1M conv), VGG-19 (20.0M params), Resnet-18
      (271K params; Figure 2 lists 274K total / 270K conv)
    parameters_pruned: weights of fully-connected/convolutional layers only; Lenet
      and Conv-2/4/6 output-layer weights pruned at half the fully-connected rate;
      VGG-19 output layer (5120 params) and Resnet-18 downsample (2560) and fully-connected
      output (640) params never pruned (Figure 2 lists fc0% for both deep nets)
    sparsity_grid: 'Pm decreases by ~20% of surviving weights per round: 100, 80,
      64, 51.3, 41.0, 32.8, 26.3, 21.1, 16.9, 13.5, 10.8, 8.7, 7.0, 5.6, 4.5, 3.6,
      2.9, 2.3, 1.9, ... down to ~0.3% in Figure 4. Overall Pm deviates slightly from
      0.8^k for Lenet/Conv nets because the output layer is pruned at half rate; axis
      labels in Figures 4/5 are the paper''s own values'
  frequency: not time-series; validation/test loss and accuracy evaluated every 100
    training iterations; accuracy reported at the early-stopping iteration (minimum
    validation loss) and at the final training iteration of each round
  preprocessing:
    mnist_split: randomly sample 5,000-example validation set from the 60,000 training
      examples; train on remaining 55,000 (Appendix G.1)
    cifar10_split: randomly sample 5,000-example validation set from the 50,000 training
      examples; train on remaining 45,000 (Appendix H.1, I.3)
    batching: mini-batches of 60 examples for Lenet and Conv-2/4/6; 128 for Resnet-18;
      64 for VGG-19; training set shuffled each epoch
    augmentation: none stated for MNIST or Conv-2/4/6; random flips and random four-pixel
      pads and crops for Resnet-18 and VGG-19 (Appendix I.2/I.3)
    input_normalization: not stated in the paper for MNIST or CIFAR10
    initialization: Gaussian Glorot (Glorot & Bengio, 2010) for all architectures
      (Figure 2 caption; Appendices G.1, H.1, I.2, I.3); bias initialization not stated
    regularization: no weight decay or batchnorm for Lenet/Conv-2/4/6 (dropout 0.5
      only in the dropout experiments); batchnorm and weight decay 0.0001 for VGG-19
      and Resnet-18
  splits:
    mnist_train: 55000
    mnist_validation: 5000
    mnist_test: 10000
    cifar10_train: 45000
    cifar10_validation: 5000
    cifar10_test: 10000
    reported_split_main_body: test set (validation used only to locate the early-stopping
      iteration)
    reported_split_appendices: validation set for all hyperparameter-selection figures
      (Appendices G, H, I)
method:
  signal: 'Iterative unstructured magnitude pruning with weight rewinding: train the
    dense network to the end of its iteration budget, prune the smallest-magnitude
    surviving weights (layer-wise for Lenet/Conv-2/4/6, globally over conv layers
    for VGG-19/Resnet-18), reset surviving weights to their original initialization
    theta_0, and retrain; over n rounds this prunes p^(1/n)% of survivors per round.
    The resulting mask + original-init subnetwork f(x; m ⊙ theta_0) is the ''winning
    ticket''.'
  model:
    architecture_primary: Lenet-300-100 fully-connected (784-300-100-10), 266K weights
    optimizer_primary: Adam, learning rate 0.0012 (Figure 2 lists Adam 1.2e-3; Appendix
      G.2 selects 0.0012 after a sweep); constant learning rate, no decay stated
    batch_size_primary: 60
    train_length_primary: '50,000 iterations per pruning round (Figure 2 ''Iterations/Batch''
      = 50K/60; Appendix G.1: trained the full 50,000 iterations regardless of when
      early stopping would occur), i.e. ~54.5 epochs of the 55,000-example training
      set'
    loss: not stated in paper; multi-class classification implies softmax cross-entropy
    pruning_rate_primary: 20% of the weights surviving the previous round, applied
      per layer (10% for the output layer, i.e. half rate) — Figure 2 'fc20%'; Appendix
      G.4
    pruning_snapshot: weights are ranked by magnitude at the FINAL training iteration
      of each round (theta_j), not at the early-stopping iteration (Section 1 central
      experiment; Appendix G.1)
    pruning_scope_primary: layer-wise (each layer pruned independently at the same
      rate) for Lenet and Conv-2/4/6; global across all convolutional layers for VGG-19
      and Resnet-18 (Section 4; Appendix I.1)
    n_rounds_primary: ~26 rounds of 20% pruning to reach Pm ~ 0.3% (smallest level
      plotted in Figure 4); claims require levels at least as sparse as Pm = 2.9%
    reset_rule: 'Strategy 1 (iterative pruning with resetting): after each pruning
      round, surviving weights are reset to theta_0 before retraining (Appendix B);
      Strategy 1 dominates Strategy 2 (Figures 9, 10)'
    initialization: Gaussian Glorot
    one_shot_variant: 'train once for the full budget, prune p% of weights in a single
      step, reset survivors to theta_0 (Figure 4c levels: 100, 87.5, 75.0, 62.6, 50.1,
      37.6, 25.1, 12.7)'
    reinit_control: keep mask m, resample theta_0' ~ D_theta (Gaussian Glorot) per
      layer; 3 reinitializations per trial (15 runs per point, Section 2)
    random_sparsity_control: random mask with the same per-layer sparsity as the winning
      ticket (Appendix E, Figure 14; Figure 1 random sampling averages ten trials)
    conv_hparams: 'Conv-2: Adam 2e-4, batch 60, 20K iters, prune conv 10% / fc 20%
      / output 10% per round; Conv-4: Adam 3e-4, batch 60, 25K iters, conv 10% / fc
      20% / output 10%; Conv-6: Adam 3e-4, batch 60, 30K iters, conv 15% / fc 20%
      / output 10% (Figure 2; Appendices H.1, H.4)'
    dropout_hparams: 'dropout rate 0.5; iteration budget tripled (Conv-2 60,000; Conv-4
      75,000; Conv-6 90,000); learning rates re-selected: Adam 0.0003 for Conv-2 and
      0.0002 for Conv-4 and Conv-6 (Figure 6 caption; Appendix H.5)'
    deep_net_hparams: 'Resnet-18: SGD momentum 0.9, weight decay 1e-4, batchnorm,
      batch 128, 30,000 iterations with 10x LR drops at 20,000 and 25,000 (stages
      20K/5K/5K), initial LR 0.1 or 0.01 (or 0.03 with warmup), global conv pruning
      20% per round, downsample (2560) and output (640) params unpruned. VGG-19: SGD
      momentum 0.9, weight decay 1e-4, batchnorm, batch 64, 160 epochs = 112,480 iterations
      with 10x LR drops at 80 and 120 epochs, initial LR 0.1 or 0.01, global conv
      pruning 20% per round, 5120 output params unpruned. Linear LR warmup from 0
      to the initial LR over k iterations (k = 20000 for Resnet-18 at LR 0.03; k =
      10000 for VGG-19 at LR 0.1)'
  evaluation:
  - Test accuracy at each sparsity level Pm for winning tickets (original init) and
    for random reinitializations of the same masks
  - Test accuracy at the final training iteration (iteration 50,000 for Lenet; 20K/25K/30K
    for Conv-2/4/6; 30K for Resnet-18; 112K for VGG-19)
  - Test accuracy at the early-stopping iteration (iteration of minimum validation
    loss)
  - Early-stopping iteration (iteration of minimum validation loss) as a proxy for
    learning speed
  - Training accuracy at early-stopping and at end of training (generalization gap)
  - Validation accuracy at early-stopping for the appendix hyperparameter sweeps
  eval_protocol:
    early_stopping_criterion: iteration of minimum validation loss, determined retroactively;
      training always runs the full iteration budget (Appendix C, G.1)
    eval_interval: validation and test loss/accuracy measured every 100 training iterations
      (Appendix G.1, H.1)
    aggregation: mean over 5 trials (main body); mean over 3 trials in the appendix
      sweeps; error bars are the minimum and maximum over trials
    reinit_aggregation: mean over 15 runs (3 random reinitializations per each of
      5 trials); random-sparsity curves in Figure 1 average ten trials
    reported_split: test set in main body (Sections 2-4); validation set in appendix
      hyperparameter sweeps (Appendices G, H, I)
    comparison_rule: 'a winning ticket is declared when accuracy >= the unpruned network''s
      accuracy AND the early-stopping iteration <= the unpruned network''s early-stopping
      iteration (Section 1 formalism: j'' <= j, a'' >= a)'
    threshold_determination: the paper does not state how the Pm 'drop-off' / 'remains
      above' crossing points (e.g. 2.9%, 21.1%, 2%) are computed from the averaged
      curves; see ambiguity threshold_rule
  variants:
    lenet_ticket_iterative:
      architecture: Lenet-300-100 on MNIST
      pruning: iterative, layer-wise magnitude, 20% of survivors per round (output
        layer 10%)
      weights_at_reset: original initialization theta_0
      trials: 5
      optimizer: Adam 0.0012, batch 60, 50,000 iterations per round
      split: test
    lenet_reinit_iterative:
      pruning: same masks as lenet_ticket_iterative
      weights_at_reset: freshly sampled Gaussian Glorot theta_0' (per layer)
      trials: 15 (3 reinits per each of 5 trials)
      split: test
    lenet_ticket_oneshot:
      pruning: 'one-shot: train once for 50,000 iterations, prune p% in a single step,
        reset survivors to theta_0'
      trials: 5
      sparsity_grid: 100, 87.5, 75.0, 62.6, 50.1, 37.6, 25.1, 12.7 (Figure 4c axis
        labels)
      split: test
    lenet_reinit_oneshot:
      pruning: one-shot masks with randomly reinitialized weights
      trials: 15 (3 reinits per each of 5 trials)
      split: test
    lenet_random_sparsity:
      pruning: random mask with same per-layer sparsity as iterative winning ticket
      trials: 10 (Figure 1 dashed lines); Appendix E Figure 14 compares original init,
        reinit and random sparsity
      split: test
    lenet_unpruned:
      pruning: none (Pm = 100%)
      trials: 5
      split: test
    conv2_ticket_iterative:
      architecture: Conv-2 on CIFAR10
      optimizer: Adam 2e-4, batch 60, 20,000 iterations
      pruning: 'layer-wise: conv 10%, fc 20%, output 10% per round'
      trials: 5
      split: test
    conv4_ticket_iterative:
      architecture: Conv-4 on CIFAR10
      optimizer: Adam 3e-4, batch 60, 25,000 iterations
      pruning: 'layer-wise: conv 10%, fc 20%, output 10% per round'
      trials: 5
      split: test
    conv6_ticket_iterative:
      architecture: Conv-6 on CIFAR10
      optimizer: Adam 3e-4, batch 60, 30,000 iterations
      pruning: 'layer-wise: conv 15%, fc 20%, output 10% per round'
      trials: 5
      split: test
    conv2_dropout:
      regularization: dropout 0.5
      optimizer: Adam 0.0003, 60,000 iterations (3x the no-dropout budget)
      pruning: 'layer-wise: conv 10%, fc 20%, output 10% per round'
      trials: 5 (main body)
      split: test (Figure 6, main body)
    conv4_dropout_test:
      regularization: dropout 0.5
      optimizer: Adam 0.0002, 75,000 iterations (3x)
      pruning: 'layer-wise: conv 10%, fc 20%, output 10% per round'
      trials: 5 (main body)
      split: test (Figure 6, main body)
    conv6_dropout_test:
      regularization: dropout 0.5
      optimizer: Adam 0.0002, 90,000 iterations (3x)
      pruning: 'layer-wise: conv 15%, fc 20%, output 10% per round'
      trials: 5 (main body)
      split: test (Figure 6, main body)
    conv4_dropout:
      regularization: dropout 0.5
      optimizer: Adam 0.0002, 75,000 iterations (3x)
      pruning: 'rates from Appendix H.4: conv 10%, fc 20%, output 10% per round'
      trials: 3 (appendix)
      split: validation (Appendix H.5, Figure 36)
    conv6_dropout:
      regularization: dropout 0.5
      optimizer: Adam 0.0002, 90,000 iterations (3x)
      pruning: 'rates from Appendix H.4: conv 15%, fc 20%, output 10% per round'
      trials: 3 (appendix)
      split: validation (Appendix H.5, Figure 36)
    conv4_val_lr0003:
      optimizer: Adam 0.0003, batch 60, 25,000 iterations
      trials: 3
      split: validation (Appendix H.2 sweep)
      pruning: 'temporary sweep rates: fc 20% / conv 10% / output 10% per round (Appendix
        H.2)'
    conv6_val_lr0003:
      optimizer: Adam 0.0003, batch 60, 30,000 iterations
      trials: 3
      split: validation (Appendix H.2 sweep)
      pruning: 'temporary sweep rates: fc 20% / conv 10% / output 10% per round (Appendix
        H.2); note the finally selected Conv-6 conv rate is 15%'
    resnet18_lr001_global:
      architecture: 'Resnet-18 on CIFAR10, 271K params (Figure 2: 274K total / 270K
        conv)'
      optimizer: SGD momentum 0.9, lr 0.01 with 10x drops at 20,000 and 25,000, weight
        decay 1e-4, batchnorm, batch 128, 30,000 iterations
      pruning: global over conv layers, 20% of survivors per round; output (640) and
        downsample (2560) params unpruned
      trials: 5 (main body)
      split: test
    resnet18_lr01_unpruned:
      pruning: none (Pm = 100%)
      optimizer: SGD momentum 0.9, lr 0.1 with 10x drops at 20,000 and 25,000, weight
        decay 1e-4, batch 128, 30,000 iterations
      split: test
    resnet18_lr003_warmup20k_global:
      optimizer: SGD momentum 0.9, lr 0.03 with linear warmup from 0 over k = 20000
        iterations, 10x drops at 20,000 and 25,000, weight decay 1e-4, batch 128,
        30,000 iterations
      pruning: global conv 20% of survivors per round
      split: test
    vgg19_lr001_global:
      architecture: VGG-19 for CIFAR10 (Liu et al. 2019 variant), 20.0M params
      optimizer: SGD momentum 0.9, lr 0.01, weight decay 1e-4, batchnorm, batch 64,
        160 epochs = 112,480 iterations (10x drops at 80 and 120 epochs)
      pruning: global conv 20% of survivors per round; 5120 output params unpruned
      split: test
    vgg19_lr01_warmup10k_global:
      optimizer: SGD momentum 0.9, lr 0.1 with linear warmup from 0 over k = 10000
        iterations, weight decay 1e-4, batch 64, 112,480 iterations (10x drops at
        80 and 120 epochs)
      pruning: global conv 20% of survivors per round
      split: test
    vgg19_lr01_warmup10k_layerwise:
      optimizer: SGD momentum 0.9, lr 0.1 with linear warmup k = 10000, weight decay
        1e-4, batch 64, 112,480 iterations
      pruning: layer-wise conv pruning at 20% per round (Appendix I.1 comparison;
        Figures 38 and 40)
      split: Figure 38 (source of the Pm >= 6.9% statement) is labelled validation
        accuracy; Figure 40 shows the test-accuracy version
baselines:
- Unpruned original network (Pm = 100%) trained with identical hyperparameters
- Random reinitialization of the winning-ticket mask (structure kept, weights resampled
  from Gaussian Glorot)
- Random sparse subnetwork with the same per-layer parameter count (random sparsity,
  Appendix E; Figure 1 random sampling)
- One-shot magnitude pruning with weight rewinding
- Pruning at iteration 0 (magnitude pruning before any training, Appendix F.4)
- Reinitialization sampled from the winning ticket's own per-layer initialization
  distribution D_m (Appendix F.3)
- Gaussian noise added to winning ticket initialization at 0.5 sigma, 1 sigma, 2 sigma,
  3 sigma (Appendix F.7)
- Iterative pruning with continued training instead of resetting (Strategy 2, Appendix
  B)
- Layer-wise pruning as the comparison for global pruning on VGG-19 / Resnet-18 (Appendix
  I.1)
ambiguities:
- id: lr_schedule
  question: What learning-rate schedule is used when training Lenet-300-100 on MNIST
    in each pruning round?
  config_key: lr_schedule
  options:
  - constant
  - cosine
  - step
  - as_paper
  default: constant
  source: paper_text
  reason: Figure 2 and Appendix G.2 specify Adam at a single fixed learning rate (1.2e-3
    / 0.0012) for Lenet with no decay mentioned; step schedules are described only
    for Resnet-18 and VGG-19.
  sensitivity: medium
- id: augmentation
  question: Is any train-time data augmentation applied to MNIST (and to Conv-2/4/6
    on CIFAR10)?
  config_key: augmentation
  options:
  - none
  - standard
  - as_paper
  default: none
  source: paper_text
  reason: Appendices G.1 and H.1 describe only shuffling and mini-batching; augmentation
    (random flips, four-pixel pads/crops) is stated only for Resnet-18/VGG-19 (Appendix
    I.2/I.3).
  sensitivity: low
- id: batch_vs_steps
  question: If the training budget must be altered, is it held in epochs or in optimizer
    steps?
  config_key: batch_vs_steps
  options:
  - epochs
  - steps
  default: steps
  source: paper_text
  reason: The paper always states budgets in iterations at a fixed batch size (Lenet
    50,000 at batch 60; Conv-2/4/6 20K/25K/30K at batch 60; Resnet-18 30K at batch
    128; VGG-19 112,480 at batch 64), so step count is the paper's primitive.
  sensitivity: high
- id: mixed_precision
  question: Is mixed precision used at train time?
  config_key: mixed_precision
  options:
  - fp32
  - amp
  default: fp32
  source: conventions_kb
  reason: Paper never mentions numeric precision; magnitude-pruning thresholds are
    precision-sensitive, so fp32 is the conservative choice.
  sensitivity: low
- id: split
  question: Is the reported accuracy at each sparsity level taken from the validation
    set or the test set?
  config_key: split
  options:
  - validation
  - test
  default: test
  source: paper_text
  reason: 'Appendix G.1/H.1: hyperparameter-selection figures (Appendices G, H, I)
    use the 5,000-example validation set, while the main-body figures (3, 4, 5, 6,
    7, 8) report test-set accuracy with validation used only to locate the early-stopping
    iteration. Claims drawn from Appendix H.2/H.5 and Figure 38 are therefore validation-set
    quantities.'
  sensitivity: medium
- id: pruning_scope
  question: Is magnitude pruning applied per layer or globally across layers for Lenet?
  config_key: pruning_scope
  options:
  - layerwise
  - global
  default: layerwise
  source: paper_text
  reason: 'Section 2 and Appendix I.1: Lenet and Conv-2/4/6 are pruned layer-wise
    at equal per-layer rates; global pruning is used only for VGG-19 and Resnet-18.'
  sensitivity: high
- id: output_layer_rate
  question: At what rate is the 10-unit output layer pruned?
  config_key: output_layer_pruning_rate
  options:
  - half_of_base_rate_10pct
  - same_as_base_20pct
  - never_pruned
  default: half_of_base_rate_10pct
  source: paper_text
  reason: 'Section 2 and Appendix G.4: connections to outputs are pruned at half the
    rate of the rest of the network (10% when the base rate is 20%), because the output
    layer holds only 1,000 of 266,000 weights. For VGG-19/Resnet-18 the fc/output
    layers are not pruned at all (Figure 2 fc0%).'
  sensitivity: medium
- id: prune_biases
  question: Are biases (and, for the deep nets, batchnorm parameters) included in
    the pruned parameter set and in the Pm denominator?
  config_key: prune_biases
  options:
  - weights_only
  - weights_and_biases
  default: weights_only
  source: conventions_kb
  reason: The paper counts 'weights' (266K = 784*300 + 300*100 + 100*10) and speaks
    exclusively of connections; biases and batchnorm parameters are never described
    as pruned.
  sensitivity: medium
- id: reset_strategy
  question: Between pruning rounds, are surviving weights reset to theta_0 (Strategy
    1) or retrained from the already-trained values (Strategy 2)?
  config_key: iterative_strategy
  options:
  - resetting
  - continued_training
  default: resetting
  source: paper_text
  reason: 'Appendix B: all main-body results use Strategy 1 (iterative pruning with
    resetting), which dominates Strategy 2 in Figures 9 and 10.'
  sensitivity: high
- id: reinit_distribution
  question: How are random-reinitialization control weights drawn?
