  config_key: early_stopping_criterion
  options:
  - min_validation_loss_every_100_iters
  - min_validation_loss_every_epoch
  - max_validation_accuracy
  default: min_validation_loss_every_100_iters
  source: paper_text
  reason: 'Appendices C and G.1: iteration of minimum validation loss, evaluated every
