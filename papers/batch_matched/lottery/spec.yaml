      pruning: layer-wise, conv 10%/round, fc 20%/round, output 10%/round
      metric_split: test accuracy at early-stop (Figure 6)
      trials: 5
    conv6_dropout:
      dropout: rate 0.5
      optimizer: Adam lr=0.0002 (Figure 6 caption)
