data:
  sources:
  - canonical: mnist
    description: MNIST handwritten digits, 60,000 train / 10,000 test, 28x28 grayscale,
      10 classes; used for Lenet-300-100 experiments (Section 2, Appendices B-G).
    substitute: torchvision
  - canonical: cifar10
    description: CIFAR-10 (Krizhevsky & Hinton 2009), 50,000 train / 10,000 test 32x32
      color (three-channel) images, 10 classes; used for Conv-2/4/6 (Section 3) and
      VGG-19 / Resnet-18 (Section 4).
    substitute: torchvision
  universe:
    task: image classification (10-way), supervised
    architectures_mnist: Lenet-300-100 fully connected (hidden 300, 100; output 10),
      266K weights (Figure 2; Appendix G.1)
    architectures_cifar_small: Conv-2 (conv 64,64,pool + FC 256,256,10; 4.3M total
      / 38K conv weights), Conv-4 (64,64,pool,128,128,pool + FC 256,256,10; 2.4M /
      260K), Conv-6 (64,64,pool,128,128,pool,256,256,pool + FC 256,256,10; 1.7M /
      1.1M) — scaled-down VGG variants, 3x3 convs, maxpool stride 2 after every two
      convs (Figure 2; Appendix H.1)
    architectures_cifar_deep: 'VGG-19 for CIFAR10 (Liu et al. 2019 variant; 20.0M
      params; five groups of 3x3 convs, first four followed by maxpool stride 2, last
      followed by average pooling, then one dense output layer of 5120 params). Resnet-18
      (He et al. 2016 CIFAR variant; 20 layers: initial conv 16 channels, then 3x[16,16],
      3x[32,32], 3x[64,64] residual pairs, avg-pool, FC 10; 271,000 params per Section
      4, listed as 274K total / 270K conv in Figure 2)'
    init: Gaussian Glorot (Glorot & Bengio 2010) for all networks
  frequency: not time-series; training measured in iterations (mini-batch steps) with
    validation/test evaluation every 100 iterations
  preprocessing:
    mnist_augmentation: none stated in paper
    conv246_augmentation: not stated in paper (Appendix H.1 silent; assume none)
    vgg_resnet_augmentation: random flips and random four-pixel pads and crops (Appendix
      I.3; Appendix I.2 states VGG-19 uses the same procedure)
    input_normalization: not stated in paper for either dataset (see ambiguity input_normalization)
    shuffling: training set shuffled at each epoch (Appendices G.1, H.1)
    batch_sizes: Lenet 60, Conv-2/4/6 60, Resnet-18 128, VGG-19 64 (Figure 2; Appendices
      G.1, H.1, I.2, I.3)
    weight_decay: 0.0001 for VGG-19 and Resnet-18 (Appendices I.2, I.3); none stated
      for Lenet/Conv-2/4/6
    batchnorm: used for VGG-19 and Resnet-18 only (Appendices I.2, I.3)
    dropout: only in the dedicated dropout experiments for Conv-2/4/6 (rate 0.5, Section
      3 / Appendix H.5); placement unspecified
  splits:
    mnist_train: 55,000 (60,000 minus 5,000 randomly sampled validation) (Appendix
      G.1)
    mnist_validation: 5,000 randomly sampled from the training set (Appendix G.1)
    mnist_test: 10,000 (Appendix G.1)
    cifar10_train: 45,000 (50,000 minus 5,000 randomly sampled validation) (Appendices
      H.1, I.3)
    cifar10_validation: 5,000 randomly sampled from the training set (Appendices H.1,
      I.3)
    cifar10_test: 10,000 (Appendix H.1)
    reporting_rule: main-body figures report TEST accuracy (at the early-stopping
      iteration determined by minimum VALIDATION loss, or at fixed iterations for
      VGG-19/Resnet-18); appendix hyperparameter-selection sweeps (G, H, I) report
      VALIDATION accuracy at the early-stopping iteration
method:
  signal: 'Iterative magnitude pruning with weight rewinding (Appendix B ''Strategy
    1: iterative pruning with resetting''): train the dense net for j iterations,
    prune the lowest-magnitude surviving weights (s% per round; equivalently p^(1/n)%
    of the weights surviving the previous round over n rounds), reset the remaining
    weights to their original initialization theta_0, and repeat; the resulting sparse
    subnetwork f(x; m*theta_0) is a ''winning ticket''. One-shot pruning (train once,
    prune p% in a single step, reset) is used only for Lenet in Figures 4c/4a.'
  model:
    lenet: Lenet-300-100 FC; Adam lr=1.2e-3 (0.0012); 50,000 iterations per round;
      batch 60; layer-wise pruning, each layer independently at 20% per round, output
      layer at half rate (10% per round)
    conv2: 'conv 64,64,pool + FC 256,256,10; Adam lr=2e-4; 20,000 iterations per round;
      batch 60; layer-wise: conv 10%/round, fc 20%/round, output layer 10%/round (half
      of fc rate)'
    conv4: 'conv 64,64,pool,128,128,pool + FC 256,256,10; Adam lr=3e-4; 25,000 iterations
      per round; batch 60; layer-wise: conv 10%/round, fc 20%/round, output layer
      10%/round'
    conv6: 'conv 64,64,pool,128,128,pool,256,256,pool + FC 256,256,10; Adam lr=3e-4;
      30,000 iterations per round; batch 60; layer-wise: conv 15%/round, fc 20%/round,
      output layer 10%/round'
    conv_dropout: dropout rate 0.5; training iterations tripled (60K Conv-2 / 75K
      Conv-4 / 90K Conv-6); Adam lr 0.0003 (Conv-2) and 0.0002 (Conv-4, Conv-6) per
      Figure 6 caption and Appendix H.5; pruning rates as selected in H.4 (conv 10/10/15%,
      fc 20%, output 10%)
    resnet18: 20-layer CIFAR Resnet; SGD with momentum 0.9; three stages of 20,000
      / 5,000 / 5,000 iterations (30,000 total) with lr x0.1 at 20,000 and 25,000
      (0.1-0.01-0.001 schedule shape); batch 128; weight decay 1e-4; batchnorm; global
      pruning across convolutional layers at 20%/round; the 2560 downsample params
      and 640 FC output params are NOT pruned (Figure 2 'fc0%', Appendix I.3)
    vgg19: VGG-19 for CIFAR10 (Liu et al. 2019); SGD with momentum 0.9; 160 epochs
      = 112,480 iterations with lr x0.1 at 80 and 120 epochs; batch 64; weight decay
      1e-4; batchnorm; global pruning across convolutional layers at 20%/round; the
      5120 output-layer params are NOT pruned (Figure 2 'fc0%', Appendix I.2)
    warmup: 'linear learning-rate warmup from 0 to the initial lr over k iterations:
      k=10,000 for VGG-19 at lr 0.1; k=20,000 for Resnet-18 at lr 0.03 (Section 4,
      Appendix I.5)'
    initial_learning_rates_studied: VGG-19 and Resnet-18 each run at lr 0.1 (original)
      and 0.01 plus the warmup settings; iterative pruning finds winning tickets only
      at the lower rate or with warmup
    loss: softmax cross-entropy (not stated explicitly in the paper)
  evaluation:
  - Early-stopping iteration = iteration of minimum validation loss, computed retroactively
    (proxy for learning speed; Appendix C)
  - Test accuracy at the early-stopping iteration
  - Training accuracy at the early-stopping iteration and at the end of training (Appendix
    D, Figures 12/13)
  - 'Test accuracy at fixed iterations: 50K for Lenet (Figure 4b); 20K/25K/30K for
    Conv-2/4/6 (Figure 5 bottom right); 10K/20K/30K for Resnet-18 (Figure 8); 30K/60K/112K
    for VGG-19 (Figure 7)'
  - For VGG-19 and Resnet-18 early-stopping time is NOT reported (entangled with learning-rate
    schedules); only accuracy at fixed iterations
  - Curves plotted vs percent of weights remaining Pm = ||m||_0 / |theta|
  eval_protocol:
    trials_main_body: 5 trials per point; lines are averages, error bars are min/max
      across trials (Figures 3/4/5 captions; Appendix H.1)
    trials_appendix: 3 trials per point in the hyperparameter appendices (G.1, H.1);
      lines are averages with min/max error bars
    reinit_trials: each winning ticket randomly reinitialized 3 times -> 15 runs per
      point (Section 2 p.4; Figure 5 caption)
    random_sampling_trials_figure1: randomly sampled sparse networks in Figure 1 are
      averages of ten trials; winning-ticket solid lines are averages of five trials
    eval_interval: validation and test loss/accuracy measured every 100 training iterations
      (Appendices G.1, H.1)
    training_length: each round trains the full specified number of iterations regardless
      of early stopping; no validation/test data influences training
    mask_handling: mask m held fixed during training (pruned weights stay zero)
    pruning_scope: layer-wise, each layer independently, for Lenet and Conv-2/4/6
      (output layer at half the fc rate); global across convolutional layers for VGG-19
      and Resnet-18, with output/downsample params unpruned
    pruning_criterion: lowest-magnitude weights measured at the END of the round's
      training (|theta_j|), then survivors rewound to theta_0
  variants:
    lenet_iterative:
      dataset: MNIST
      arch: Lenet-300-100
      optimizer: Adam lr=0.0012
      iterations: 50000 per round, batch 60
      pruning: iterative, layer-wise, 20%/round (output layer 10%/round), survivors
        reset to theta_0 each round
      metric_split: test accuracy at min-validation-loss iteration (and at iteration
        50,000 for Figure 4b)
      pm_levels_plotted: Figure 4a/4b axis ticks 100, 51.3, 26.3, 13.5, 7.0, 3.6,
        1.9, 1.0, 0.5, 0.3 (log axis; data at every 20%-per-round level)
      trials: 5
    lenet_oneshot:
      pruning: 'one-shot: train once, prune p% of each layer in a single step (output
        layer at half rate), reset survivors to theta_0, retrain'
      pm_grid: not enumerated in the paper; Figure 4c x-axis TICK LABELS are 100,
        87.5, 75.0, 62.6, 50.1, 37.6, 25.1, 12.7, but the text cites Pm = 95.0%, 67.5%,
        17.6%, 5.17% and Figure 4a reproduces one-shot results on a log axis down
        to Pm ~= 0.3% (see ambiguity oneshot_pm_grid)
      metric_split: test accuracy at min-validation-loss iteration
      trials: 5
    lenet_random_reinit:
      init: mask from iterative pruning retained, weights resampled theta_0' ~ D_theta
        (Gaussian Glorot) on a per-layer basis
      trials: 15 (3 reinits x 5 tickets)
    lenet_iterative_vs_reinit:
      comparison: ratio of the average early-stopping iteration of the random-reinit
        runs to that of the winning tickets at Pm=21%
      trials: 5 winning-ticket runs vs 15 reinit runs
    conv2_iterative:
      dataset: CIFAR-10
      optimizer: Adam lr=0.0002
      iterations: 20000 per round, batch 60
      pruning: layer-wise, conv 10%/round, fc 20%/round, output 10%/round
      metric_split: test (accuracy at early-stop; also at iteration 20,000)
      trials: 5
    conv4_iterative:
      optimizer: Adam lr=0.0003
      iterations: 25000 per round, batch 60
      pruning: layer-wise, conv 10%/round, fc 20%/round, output 10%/round
      metric_split: test (accuracy at early-stop; also at iteration 25,000)
      trials: 5
    conv6_iterative:
      optimizer: Adam lr=0.0003
      iterations: 30000 per round, batch 60
      pruning: layer-wise, conv 15%/round, fc 20%/round, output 10%/round
      metric_split: test (accuracy at early-stop; also at iteration 30,000)
      trials: 5
    conv2_iterative_appendix_val:
      metric_split: validation accuracy at early-stop (Appendix H.2, Figure 32 top)
