    conv4_iterative_appendix_val:
      metric_split: validation accuracy at early-stop (Appendix H.2, Figure 32 middle)
      trials: 3
      optimizer: Adam lr=0.0003
      pruning_during_lr_sweep: 'temporary rates used before the H.4 selection: fc
