baselines:
- Unpruned original (dense) network trained with identical hyperparameters
- 'Random reinitialization: winning-ticket mask with freshly sampled Gaussian Glorot
  weights (3 reinits per ticket)'
- 'Random sparsity: randomly sampled sparse subnetworks with matching parameter count
  (Appendix E, Figure 14; Figure 1 dashed lines, average of ten trials)'
- One-shot magnitude pruning with rewinding (Lenet, Figure 4c)
- Prune at iteration 0 (magnitude pruning before any training, Appendix F.4)
- Iterative pruning with continued training (Strategy 2, Appendix B) vs resetting
  (Strategy 1)
- Reinitialization sampled from the winning-ticket initialization distribution D_m
  (Appendix F.3)
- Adding Gaussian noise of 0.5/1/2/3 sigma to winning-ticket initializations (Appendix
  F.7)
ambiguities:
- id: lr_schedule
  question: What learning-rate schedule is used during each training round?
  config_key: lr_schedule
  options:
  - constant
  - cosine
  - step
  - as_paper
  default: as_paper
  source: paper_text
  reason: Paper states constant Adam learning rates for Lenet (0.0012), Conv-2 (2e-4),
    Conv-4/6 (3e-4); three-stage step decay (x0.1) for Resnet-18 at 20K/25K iterations
    and VGG-19 at 80/120 epochs, plus optional linear warmup over k iterations.
  sensitivity: high
- id: augmentation
  question: What train-time data augmentation is applied for each dataset/architecture?
  config_key: augmentation
  options:
  - none
  - standard
  - as_paper
  default: as_paper
  source: paper_text
  reason: Appendix I.3 states random flips and random four-pixel pads/crops for Resnet-18,
    and I.2 says VGG-19 uses the same procedure. The paper is silent for MNIST/Lenet
    and Conv-2/4/6, so those are assumed unaugmented (that part is an inference, not
    a stated choice).
  sensitivity: high
- id: batch_vs_steps
  question: When batch size or compute budget changes, hold epochs or optimization
    steps fixed?
  config_key: batch_vs_steps
  options:
  - epochs
  - steps
  default: steps
  source: paper_text
  reason: Paper specifies training length in iterations with fixed batch sizes (50K/60,
    20K/60, 25K/60, 30K/60, 30K/128, 112,480/64) and reports early-stopping iterations,
    so steps must be held fixed in any reduced-scale replication.
  sensitivity: high
- id: mixed_precision
  question: Train in full precision or mixed precision?
  config_key: mixed_precision
  options:
  - fp32
  - amp
  default: fp32
  source: conventions_kb
  reason: Not mentioned; 2018-era TensorFlow experiments were fp32. Magnitude-pruning
    thresholds are sensitive to numerical noise, so keep fp32 at least for the pruning
    criterion.
  sensitivity: low
- id: split
  question: Are the headline numbers validation or test accuracy?
  config_key: split
  options:
  - validation
  - test
  default: test
  source: paper_text
  reason: Appendices G.1/H.1 state main-body results are evaluated on the test set,
    while the hyperparameter-selection appendices (G, H, I) use the 5,000-example
    validation set; the early-stopping iteration itself always comes from minimum
    validation loss.
  sensitivity: high
- id: prune_biases_and_bn
  question: Are biases and batchnorm parameters pruned, or only weight matrices/convolution
    kernels?
  config_key: prune_parameter_types
  options:
  - weights_only
  - weights_and_biases
  - weights_biases_bn
  default: weights_only
  source: conventions_kb
  reason: Paper describes pruning 'connections'/weights per layer and gives counts
    that match weight tensors only (Lenet 266K = 784*300+300*100+100*10; output layer
    1,000). Biases and BN parameters are conventionally left dense and are never mentioned
    as pruned.
  sensitivity: medium
- id: n_pruning_rounds
  question: How many iterative pruning rounds are run (i.e., what final target sparsity
    per architecture)?
  config_key: n_pruning_rounds
  options:
  - per_arch_axis_limits
  - fixed_15_rounds
  - fixed_20_rounds
  - custom
  default: per_arch_axis_limits
  source: paper_text
  reason: 'No round count is stated; inferred from plotted x-axes: Lenet to Pm=0.3%
    (~26 rounds at 20%/round), Conv-2/4/6 to ~1.0-1.3%, Resnet-18 to 5.5%, VGG-19
    to 0.1%. Section 6 says networks are trained ''15 or more times consecutively''.'
  sensitivity: medium
- id: trials_and_seeds
  question: How many independent trials (seeds) per configuration, and how are error
    bars formed?
  config_key: n_trials
  options:
  - '3'
  - '5'
  - '15'
  default: '5'
  source: paper_text
  reason: Main-body figures average 5 trials with min/max error bars; appendix sweeps
    use 3; random-reinit points aggregate 15 runs (3 reinits per trial); Figure 1
    random-sampling lines average 10 trials. Seed values themselves are not given.
  sensitivity: medium
- id: validation_split_seed
  question: How is the 5,000-example validation set sampled from the training set,
    and is it fixed across trials?
  config_key: val_split_seed
  options:
  - fixed_random_seed_shared
  - resampled_per_trial
  - last_5000_examples
  default: fixed_random_seed_shared
  source: conventions_kb
  reason: Paper says 'randomly sampled a 5,000-example validation set' but gives no
    seed and does not say whether it is re-drawn per trial; a single fixed split is
    conventional and keeps early-stopping comparable across pruning levels.
  sensitivity: low
- id: adam_hyperparameters
  question: What Adam beta1/beta2/epsilon are used?
  config_key: adam_betas_eps
  options:
  - tf_defaults_0.9_0.999_1e-8
  - pytorch_defaults_0.9_0.999_1e-8
  - custom
  default: tf_defaults_0.9_0.999_1e-8
  source: conventions_kb
  reason: Only the Adam learning rate is reported; framework defaults assumed (original
    implementation was TensorFlow).
  sensitivity: low
- id: dropout_placement
  question: Where is dropout (rate 0.5) applied in Conv-2/4/6?
  config_key: dropout_placement
  options:
  - fc_layers_only
  - after_each_maxpool_and_fc
  - all_layers
  default: after_each_maxpool_and_fc
  source: guess
  reason: Section 3 only states 'a dropout rate of 0.5'; placement is unspecified
    and materially changes the dropout baselines (2.1/3.0/2.4 pp gains and the 77.6%/81.3%
    unpruned validation accuracies).
  sensitivity: medium
- id: conv_padding_and_pooling
  question: Convolution padding and pooling details for Conv-2/4/6 and VGG-19?
  config_key: conv_padding
  options:
  - same
  - valid
  default: same
  source: conventions_kb
  reason: Paper states 3x3 convolutions and maxpool stride 2 after every two convs,
    but not padding; 'same' padding reproduces the stated parameter counts (e.g.,
    Conv-2 4.3M total / 38K conv).
  sensitivity: low
- id: pruning_strategy_resetting
  question: Does each pruning round retrain from the original initialization or continue
    from trained weights?
  config_key: iterative_strategy
  options:
  - reset_to_theta0_each_round
  - continued_training
  default: reset_to_theta0_each_round
  source: paper_text
  reason: 'Appendix B: main-body results use Strategy 1 (iterative pruning with resetting),
    which dominates Strategy 2 in Figures 9 and 10.'
  sensitivity: high
- id: output_layer_rate
  question: At what rate is the output layer pruned relative to other layers?
  config_key: output_layer_prune_rate
  options:
  - half_of_other_layers
  - same_as_other_layers
  - not_pruned
  default: half_of_other_layers
  source: paper_text
  reason: 'Section 2 and Appendices G.4/H.1: connections to outputs pruned at half
    the rate (10% when fc layers are at 20%) for Lenet and Conv-2/4/6; for VGG-19/Resnet-18
    the output layer (5120 / 640 params) and Resnet downsample params (2560) are not
    pruned at all.'
  sensitivity: medium
- id: early_stop_definition
  question: How is the early-stopping iteration computed?
  config_key: early_stop_criterion
  options:
  - min_validation_loss_every_100_iters
  - min_validation_loss_every_epoch
  - max_validation_accuracy
  default: min_validation_loss_every_100_iters
  source: paper_text
  reason: 'Appendix C and G.1/H.1: iteration of minimum validation loss, evaluated
    every 100 training iterations, computed retroactively over the full fixed-length
    run. Note some appendix figures (17, 18, 25) label the axis ''Early-Stop Iteration
    (Test)''.'
  sensitivity: high
- id: loss_function
  question: What training objective is used?
  config_key: loss
  options:
  - softmax_cross_entropy
  - other
  default: softmax_cross_entropy
  source: conventions_kb
  reason: Never stated; standard for 10-way classification and required to produce
    the 'validation loss' curves of Figure 11.
  sensitivity: low
- id: pm_denominator
  question: Over which parameters is Pm = ||m||_0 / |theta| computed — all network
    weights (counting unpruned layers as fully remaining), only prunable weights,
    or all parameters including biases/BN?
  config_key: pm_denominator
  options:
  - all_weight_tensors_incl_unpruned_layers
  - prunable_weights_only
  - all_params_incl_biases_and_bn
  default: all_weight_tensors_incl_unpruned_layers
  source: guess
  reason: Paper defines Pm over |theta| but never says whether the unpruned output/downsample
    layers (VGG-19 5120; Resnet-18 640+2560) or biases enter the denominator; this
    shifts every plotted x-axis value and hence the Pm thresholds in the claims.
  sensitivity: medium
- id: oneshot_pm_grid
  question: At which Pm levels is one-shot Lenet pruning run, and are all levels derived
    from a single trained network or from separate training runs?
  config_key: oneshot_pm_grid
  options:
  - single_trained_run_many_thresholds
  - separate_run_per_level
  - figure4c_tick_levels_only
  default: single_trained_run_many_thresholds
  source: guess
  reason: Figure 4c tick labels (100...12.7) are only axis labels; the text cites
    Pm = 95.0%, 67.5%, 17.6%, 5.17% and Figure 4a reproduces one-shot lines down to
    Pm ~= 0.3%, so the grid is finer and deeper than the labels and is never enumerated.
  sensitivity: medium
- id: random_sparsity_layer_distribution
  question: For the random-sparsity baseline, how are the surviving weights distributed
    across layers?
  config_key: random_sparsity_allocation
  options:
  - match_per_layer_counts_of_winning_ticket
  - uniform_global_random
  - uniform_per_layer_rate
  default: match_per_layer_counts_of_winning_ticket
  source: guess
  reason: Appendix E only says 'random sparse subnetworks with the same number of
    parameters as those found via iterative pruning'; per-layer allocation is unspecified
    and changes the baseline substantially.
  sensitivity: medium
- id: reinit_distribution_scale
  question: When randomly reinitializing a winning ticket, is the Glorot scale computed
    from the ORIGINAL dense layer dimensions or from the surviving (sparse) fan-in/fan-out?
  config_key: reinit_glorot_scale
  options:
  - original_dense_layer_dims
  - sparse_surviving_dims
  default: original_dense_layer_dims
  source: conventions_kb
  reason: Paper only writes theta_0' ~ D_theta; since D_theta is the original initialization
    distribution, dense-layer fan-in/fan-out is the natural reading, but it is not
    stated explicitly.
  sensitivity: medium
- id: glorot_normal_variant
  question: Which Gaussian Glorot parameterization is used (std = sqrt(2/(fan_in+fan_out)),
    truncated vs untruncated normal)?
  config_key: glorot_variant
  options:
  - normal_std_sqrt2_over_fanin_plus_fanout
  - truncated_normal_same_std
  - other
  default: normal_std_sqrt2_over_fanin_plus_fanout
  source: conventions_kb
  reason: Paper says 'Gaussian Glorot' without giving the variance formula or truncation;
    the initialization-distribution figures (15/16, x-range about +/-0.25) are consistent
    with the standard Glorot normal std.
  sensitivity: low
- id: warmup_schedule_interaction
  question: How does linear warmup interact with the step decay, and is warmup reapplied
    in every pruning round?
  config_key: warmup_interaction
  options:
  - warmup_then_original_step_decay_every_round
  - warmup_only_in_first_round
  - warmup_replaces_first_stage
  default: warmup_then_original_step_decay_every_round
  source: guess
  reason: Section 4 / Appendix I.5 only state 'linear learning rate warmup from 0
    to the initial learning rate over k iterations'; for Resnet-18 k=20,000 coincides
    with the first lr drop, so the composition of warmup and decay (and whether it
    recurs each round) is unspecified and materially affects the 90.5% warmup result.
  sensitivity: high
- id: speedup_ratio_aggregation
  question: Are the reported 'x faster' early-stopping ratios computed as the ratio
    of averaged early-stop iterations, or the average of per-trial ratios?
  config_key: speedup_aggregation
  options:
  - ratio_of_trial_averages
  - average_of_per_trial_ratios
  default: ratio_of_trial_averages
  source: guess
  reason: Paper reports figures such as 2.51x, 3.5x, 4.27x, 2.61x, 1.58x from averaged
    curves but never states the aggregation order; the two choices differ numerically
    with only 3-5 trials.
  sensitivity: medium
- id: input_normalization
  question: How are input pixels scaled/normalized for MNIST and CIFAR-10?
  config_key: input_normalization
  options:
  - scale_0_1
  - per_channel_standardize
  - raw_0_255
  default: scale_0_1
  source: guess
  reason: The paper never describes input preprocessing beyond augmentation for VGG-19/Resnet-18;
    scaling affects absolute accuracies (e.g., Conv-2 ~67.6% unpruned) and the magnitude
    distribution used by pruning.
  sensitivity: medium
